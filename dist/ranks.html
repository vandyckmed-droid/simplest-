<title>Ranks — volatility-adjusted momentum</title>

<style>
  /* One typeface, two weights, hairlines, and colour on exactly one thing:
     the score. Neutrals carry a slight cool bias so the greys read as chosen
     rather than default. Both themes are defined token-level, covering all
     three viewer states (explicit light, explicit dark, unstamped system). */
  :root {
    --bg: #ffffff;
    --raise: #f7f8fa;
    --ink: #16181d;
    --ink-2: #4a4f59;
    --muted: #8a8f9a;
    --rule: #e9ebef;
    --rule-2: #d8dbe1;
    --pos: #12784a;
    --neg: #b03a2e;
    --sel: #f2f4f7;
    --flag: #9a5b12;
    --flag-bg: #f6efe4;
    --warn: #e0342f;
    --warn-glow: 224, 52, 47;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0d10;
      --raise: #131519;
      --ink: #eceef2;
      --ink-2: #b0b5be;
      --muted: #767c87;
      --rule: #1c1e24;
      --rule-2: #2a2d35;
      --pos: #46cf85;
      --neg: #ef6f60;
      --sel: #16181d;
      --flag: #e0a95c;
      --flag-bg: #221c12;
      --warn: #ff5a52;
      --warn-glow: 255, 90, 82;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c0d10;
    --raise: #131519;
    --ink: #eceef2;
    --ink-2: #b0b5be;
    --muted: #767c87;
    --rule: #1c1e24;
    --rule-2: #2a2d35;
    --pos: #46cf85;
    --neg: #ef6f60;
    --sel: #16181d;
    --flag: #e0a95c;
    --flag-bg: #221c12;
    --warn: #ff5a52;
    --warn-glow: 255, 90, 82;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 calc(52px + env(safe-area-inset-bottom));
  }

  .num { font-variant-numeric: tabular-nums; }

  :where(button, input, select):focus-visible {
    outline: 2px solid var(--ink-2);
    outline-offset: -2px;
  }

  /* ---------- header ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 16px 12px;
  }

  .title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.03em;
  }

  /* One run of grey read as a single string. Split it: the count is a figure,
     the date is a caption beneath it. */
  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    white-space: nowrap;
  }

  .meta b {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1.1;
  }

  .meta i {
    display: flex;
    align-items: center;
    gap: 5px;
    font-style: normal;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* The search row — named for what it does, now that Settings owns the
     filtering controls. It starts at 48px, not 16px, so its text lines up with
     the ticker column and the company names below rather than hanging off the
     left edge on its own. The right edge stays at 16px, matching where the
     numeric columns end. */
  .seek {
    display: flex;
    gap: 10px;
    padding: 0 16px 10px 48px;
  }

  .seek input,
  .seek select {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-bottom: 1px solid var(--rule-2);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    /* 16px exactly: iOS Safari zooms the whole viewport when a focused field is
       smaller than this, which shifts the layout out from under the reader. */
    font-size: 16px;
    padding: 4px 0;
    min-height: 32px;
  }

  /* The generic focus ring draws a box, which fights a design made of
     hairlines. These two fields state focus by owning their own rule instead. */
  .seek input:focus-visible,
  .seek select:focus-visible {
    outline: none;
    border-bottom-color: var(--ink);
    box-shadow: 0 1px 0 0 var(--ink);
  }

  .seek input { flex: 1; min-width: 0; }
  .seek input::placeholder { color: var(--muted); }
  .seek input::-webkit-search-cancel-button { display: none; }

  .pick { position: relative; flex: 0 0 auto; max-width: 48%; }
  .pick select { width: 100%; padding-right: 16px; text-overflow: ellipsis; }

  .pick::after {
    content: "";
    position: absolute;
    right: 2px;
    top: 13px;
    width: 5px;
    height: 5px;
    border-right: 1px solid var(--muted);
    border-bottom: 1px solid var(--muted);
    transform: rotate(45deg);
    pointer-events: none;
  }

  /* ---------- column headers; tapping one sorts by it ---------- */
  .head {
    display: grid;
    align-items: end;
    gap: 6px;
    padding: 0 16px 5px 0;
    border-bottom: 1px solid var(--rule-2);
  }

  .head button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 4px 0;
    font-family: inherit;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    text-align: right;
    white-space: nowrap;
  }

  .head .lbl {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 4px;
  }

  .head .lbl.l { text-align: left; }
  .head.grid .lbl:first-child { text-align: center; padding-left: 6px; }
  .head button[aria-pressed="true"] { color: var(--ink); }
  .head button[aria-pressed="true"]::after { content: attr(data-dir); margin-left: 3px; }

  /* ---------- rows ----------
     The rank column runs from the row's own left edge to 42px, and the cell is
     inset by the 6px gap, so the digits centre on 24px — exactly halfway to the
     ticker's left edge at 48px. */
  .grid { grid-template-columns: 42px minmax(0, 1fr) 46px 50px 42px; }
  .grid-basket { grid-template-columns: minmax(0, 1fr) 46px 46px 42px; }
  /* "$1,000" needs more room than "10%"; two classes, so this beats .grid-basket */
  .grid-basket.cash { grid-template-columns: minmax(0, 1fr) 56px 44px 40px; }

  .list { display: flex; flex-direction: column; }

  .row {
    appearance: none;
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: grid;
    align-items: center;
    gap: 6px;
    padding: 9px 16px 9px 0;
    min-height: 46px;
  }

  /* two classes, so this beats .row's shorthand rather than racing it */
  .row.grid-basket { padding-left: 16px; }

  .row[aria-pressed="true"] { background: var(--sel); }

  .rank {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    text-align: center;
    padding-left: 6px;
  }

  .row[aria-pressed="true"] .rank { color: var(--ink-2); font-weight: 600; }

  .id { min-width: 0; }

  .id b {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  /* Name line: the company name gives way to the flags rather than pushing
     them into the numbers. */
  .sub {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    margin-top: 1px;
  }

  .sub i {
    font-style: normal;
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  /* Sector mark: identity, so it stays in the muted ink of the line it sits on. */
  .sub svg {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    opacity: .85;
  }

  /* Sector concentration: a dot, not a label. Small enough to cost nothing,
     lit enough to catch the eye on either ground. */
  .dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 2px rgba(var(--warn-glow), .16), 0 0 7px 1px rgba(var(--warn-glow), .55);
  }

  /* Flags are the one place a second hue appears. They carry their own number,
     so the colour is emphasis rather than the message. */
  .sub em {
    flex: 0 0 auto;
    font-style: normal;
    font-weight: 600;
    font-size: 9.5px;
    letter-spacing: .02em;
    color: var(--flag);
    background: var(--flag-bg);
    border-radius: 3px;
    padding: 1.5px 4px;
    white-space: nowrap;
  }

  .n {
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
  }

  .n.score { font-weight: 600; color: var(--ink); }
  .n.score[data-sign="pos"] { color: var(--pos); }
  .n.score[data-sign="neg"] { color: var(--neg); }

  .more {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    padding: 14px;
    cursor: pointer;
  }

  .empty {
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------- filters panel ---------- */
  .fgroup { padding: 4px 16px 0; }

  .fgroup h2 {
    margin: 18px 0 8px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .choice { display: flex; gap: 14px; align-items: center; }

  .choice button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 2px 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .choice button[aria-pressed="true"] {
    color: var(--ink);
    box-shadow: inset 0 -1.5px 0 var(--ink);
  }

  /* an active filter has to be visible from the list, not only from its tab */
  .meta em {
    font-style: normal;
    font-weight: 600;
    font-size: 9.5px;
    color: var(--flag);
    background: var(--flag-bg);
    border-radius: 3px;
    padding: 1.5px 4px;
    margin-right: 6px;
  }

  /* ---------- basket summary ---------- */
  .sum { padding: 4px 16px 0; }

  .sum-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }

  .sum-row:last-child { border-bottom: 0; }
  .sum-row span:first-child { color: var(--muted); }
  .sum-row span:last-child { font-variant-numeric: tabular-nums; }

  .sec-head {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 16px 4px;
    border-bottom: 1px solid var(--rule-2);
  }

  /* ---------- footer tabs ---------- */
  .tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    background: var(--bg);
    border-top: 1px solid var(--rule-2);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .tabs button {
    flex: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    min-height: 50px;
    cursor: pointer;
  }

  .tabs button[aria-pressed="true"] { color: var(--ink); }

  /* .filters and .head are flex/grid, which outranks the hidden attribute */
  [hidden] { display: none !important; }

  @media (min-width: 600px) {
    .shell { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); min-height: 100vh; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="title">
      <h1 id="heading">Ranks</h1>
      <span class="meta" id="meta" hidden><b id="count-n"></b><i id="asof"></i></span>

      <button type="button" data-sort="ret" data-dir="↓" aria-pressed="false">Ret</button>
      <button type="button" data-sort="vol" data-dir="↑" aria-pressed="false">Vol</button>

  </header>

  <div class="fgroup" id="settings-panel" hidden>

    <div class="choice" role="group" aria-label="Universe">
      <button type="button" data-universe="stocks" aria-pressed="true">Stocks</button>
      <button type="button" data-universe="etfs" aria-pressed="false">ETFs</button>

    <h2>Weights</h2>
    <div class="choice" role="group" aria-label="Weighting">
      <button type="button" data-weight="eq" aria-pressed="false">Equal</button>
      <button type="button" data-weight="iv" aria-pressed="true">Inv vol</button>
      <button type="button" data-weight="hrp" aria-pressed="false" title="Hierarchical risk parity: 252-day returns, shrunk covariance, clustered, capped at 10%">HRP</button>
    </div>

    <h2>Display</h2>
    <div class="choice" role="group" aria-label="Weight display">
      <button type="button" data-display="pct" aria-pressed="true">Percent</button>
      <button type="button" data-display="cash" aria-pressed="false" title="Cash needed per holding in a $10,000 portfolio">Cash</button>
    </div>

    <h2>Metric</h2>
    <div class="choice" role="group" aria-label="Metric">
      <button type="button" data-metric="0" aria-pressed="true">Blend</button>
      <button type="button" data-metric="1" aria-pressed="false">12-1</button>
      <button type="button" data-metric="2" aria-pressed="false">6-1</button>
    </div>

    <h2 id="cap-head">Market cap</h2>
    <div class="choice" id="cap-choice" role="group" aria-label="Market cap cutoff">
      <button type="button" data-cap="0" aria-pressed="true">All</button>
      <button type="button" data-cap="500" aria-pressed="false">Top 500</button>
    </div>
  </div>

  <div class="sum" id="sum" hidden></div>
  <main class="list" id="list"></main>
</div>

<nav class="tabs">
  <button type="button" id="tab-ranks" aria-pressed="true">Ranks</button>
  <button type="button" id="tab-basket" aria-pressed="false">Basket</button>
  <button type="button" id="tab-settings" aria-pressed="false">Settings</button>
</nav>

//
// This file is both a Node module (so `npm run test:hrp` can check the maths

//
// The pipeline, in the order it runs:

//     -> correlation distance -> average-linkage tree -> quasi-diagonalisation
//     -> recursive bisection -> 10% cap -> normalise
//
// Why shrinkage: 252 observations across N names gives a sample covariance
// whose extreme eigenvalues are badly biased — the smallest are too small,
// which is exactly what an optimiser leans on. Shrinking toward a constant-
// correlation target pulls those back without discarding the structure HRP
// needs to cluster on.
//

// It only ever compares two clusters at a time, so a near-singular sample —

/**

function returnsMatrix(rows, T) {

function sampleCovariance(Y, T) {
  const n = Y.length;

  for (let i = 0; i < n; i++) {
    for (let j = i; j < n; j++) {
      let acc = 0;
      for (let t = 0; t < T; t++) acc += Y[i][t] * Y[j][t];

/**
 * Ledoit & Wolf (2003), "Honey, I Shrunk the Sample Covariance Matrix":
 * Σ̂ = δF + (1−δ)S, where F is the constant-correlation target — every sample
 * variance kept, every correlation replaced by the average one — and δ is
 * chosen analytically to minimise expected squared error.
 *
 * δ = ((π̂ − ρ̂) / γ̂) / T, clipped to [0,1]:
 *   π̂  how noisy the sample covariance entries are
 *   ρ̂  how much that noise is shared with the target
 *   γ̂  how wrong the target is (its squared distance from S)
 *

 * shrinks hard; a long clean sample against a badly-fitting target barely
 * shrinks at all. Nothing is tuned by hand.
 */
function shrinkCovariance(Y, S, T) {
  const n = S.length;
  if (n < 2) return { sigma: S, delta: 0 };

  const sd = new Float64Array(n);
  for (let i = 0; i < n; i++) sd[i] = Math.sqrt(Math.max(S[i][i], EPS));

  let pairs = 0;
  for (let i = 0; i < n; i++) {

  }
  rbar = pairs ? rbar / pairs : 0;

  // fourth moments — this is what makes the intensity adapt to fat tails.
  const piMat = Array.from({ length: n }, () => new Float64Array(n));
  let pi = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i; j < n; j++) {
      let acc = 0;
      for (let t = 0; t < T; t++) {
        const d = Y[i][t] * Y[j][t] - S[i][j];
        acc += d * d;
      }
      piMat[i][j] = piMat[j][i] = acc / T;
      pi += i === j ? piMat[i][j] : 2 * piMat[i][j];

  let rho = 0;
  for (let i = 0; i < n; i++) rho += piMat[i][i];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      let tii = 0;
      let tjj = 0;
      for (let t = 0; t < T; t++) {
        const cross = Y[i][t] * Y[j][t] - S[i][j];
        tii += (Y[i][t] * Y[i][t] - S[i][i]) * cross;
        tjj += (Y[j][t] * Y[j][t] - S[j][j]) * cross;
      }
      tii /= T;
      tjj /= T;
      rho += (rbar / 2) * ((sd[j] / sd[i]) * tii + (sd[i] / sd[j]) * tjj);
    }

  let gamma = 0;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const f = i === j ? S[i][i] : rbar * sd[i] * sd[j];
      const d = f - S[i][j];
      gamma += d * d;
    }
  }

  const delta = gamma > EPS ? Math.max(0, Math.min(1, (pi - rho) / gamma / T)) : 0;
  if (delta <= 0) return { sigma: S, delta: 0 };

  const sigma = Array.from({ length: n }, () => new Float64Array(n));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const f = i === j ? S[i][i] : rbar * sd[i] * sd[j];
      sigma[i][j] = delta * f + (1 - delta) * S[i][j];

}

/**
 * d = √(½(1−ρ)) — a proper metric on correlation: identical names sit at 0,

 */
function distanceMatrix(sigma) {
  const n = sigma.length;
  const sd = new Float64Array(n);
  for (let i = 0; i < n; i++) sd[i] = Math.sqrt(Math.max(sigma[i][i], EPS));

/**

 * concatenating each merge's members *is* the dendrogram's leaf order, so
 * quasi-diagonalisation falls out of the tree rather than needing a second
 * pass: correlated names end up adjacent and the covariance matrix read in this
 * order is close to block-diagonal.
 *
 * Average linkage (UPGMA) rather than the single linkage of the original HRP
 * paper. Single linkage merges on the *nearest* pair, so one incidentally
 * correlated pair welds two otherwise unrelated groups together; on real equity
 * correlations it chains, and a chained tree has no cluster structure left for
 * the bisection to use. Average linkage asks whether two groups are related on
 * the whole, which is the question being posed here.
 */
function cluster(D, method = 'average') {
  const n = D.length;
  if (n === 0) return { tree: null, order: [] };
  if (n === 1) return { tree: { leaf: 0, members: [0] }, order: [0] };

  let nodes = Array.from({ length: n }, (_, i) => ({ leaf: i, members: [i] }));
  let dist = D.map((row) => Array.from(row));

    let bi = 0;
    let bj = 1;

    const b = nodes[bj];

    const nb = b.members.length;

      : (na * dist[bi][k] + nb * dist[bj][k]) / (na + nb)));

    const keep = nodes.map((_, k) => k).filter((k) => k !== bi && k !== bj);
    const nextDist = keep.map((p) => keep.map((q) => dist[p][q]));
    const row = keep.map((k) => linked[k]);
    for (let i = 0; i < nextDist.length; i++) nextDist[i].push(row[i]);
    nextDist.push([...row, 0]);

    nodes.push(merged);

/**
 * Recursive bisection down the seriated order: halve the list, hand weight to
 * the two halves in inverse proportion to their risk, recurse. Because the
 * order is quasi-diagonalised, each half is made of names that belong together,
 * so a crowded cluster competes with itself before its total competes with the
 * rest of the book.
 *
 * Two choices here were settled by measurement rather than by the paper, both
 * against the real 1,517-name universe:
 *
 * **Halving by position, not at the dendrogram's merge points.** Splitting
 * where the tree splits sounds strictly better and is much worse. Inside a
 * group with no real structure the tree is decided by noise, and an unbalanced
 * tree makes weights decay geometrically — six statistically identical names

 *

 * Measured, the variance version piles into whatever is quietest — an

 * against 28.9% and 5.5:1 here — while diversifying no better.

function bisect(sigma, order) {
  const w = new Array(sigma.length).fill(0);
  if (!order.length) return w;

  const walk = (seg, weight) => {
    if (seg.length === 1) { w[seg[0]] = weight; return; }

    const left = seg.slice(0, mid);
    const right = seg.slice(mid);

    const sr = Math.sqrt(clusterVariance(sigma, right));
    const alpha = sl + sr > EPS ? 1 - sl / (sl + sr) : 0.5;
    walk(left, weight * alpha);
    walk(right, weight * (1 - alpha));
  };
  walk(order, 1);
  return w;
}

/** Variance of a cluster held at inverse-variance weights. */
function clusterVariance(sigma, members) {
  const inv = members.map((i) => 1 / Math.max(sigma[i][i], EPS));
  const total = inv.reduce((a, b) => a + b, 0);
  const w = inv.map((x) => x / total);
  let v = 0;
  for (let a = 0; a < members.length; a++) {
    for (let b = 0; b < members.length; b++) v += w[a] * w[b] * sigma[members[a]][members[b]];

 * Caps each weight and pushes the overflow onto the names still under the cap,
 * in proportion to what they already hold — repeating, because absorbing
 * overflow can lift a name over the line itself.
 *
 * A cap only means something above 1/n: eleven names can be held under 10%
 * each, ten can only be held at *exactly* 10% each, and nine cannot be held
 * under it at all. Below that line the cap is left off rather than quietly
 * flattening the basket to equal weight.
 */
function capAndNormalise(weights, cap) {
  const n = weights.length;
  let w = normalise(weights);
  if (!(cap > 0) || cap * n <= 1 + 1e-9) return { w, bound: false };

  const before = Math.max(...w);
  for (let pass = 0; pass < 200; pass++) {
    let excess = 0;
    const free = [];
    for (let i = 0; i < n; i++) {
      if (w[i] > cap + 1e-12) { excess += w[i] - cap; w[i] = cap; }
      else free.push(i);
    }
    if (excess <= 1e-12 || !free.length) break;

    const pool = free.reduce((t, i) => t + w[i], 0);
    if (pool > EPS) for (const i of free) w[i] += (excess * w[i]) / pool;
    else for (const i of free) w[i] += excess / free.length;
  }
  return { w: normalise(w), bound: before > cap + 1e-9 };
}

function normalise(weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  if (!(total > EPS)) return weights.map(() => 1 / weights.length);
  return weights.map((x) => x / total);
}

/**

 * basket reads as 100 and a $10,000 portfolio adds up to $10,000. Rounding each
 * row on its own does not, and a column of weights is a thing readers add up.
 */

  const raw = weights.map((w) => w * total);
  const base = raw.map(Math.floor);
  let left = Math.round(total - base.reduce((a, b) => a + b, 0));
  const order = raw
    .map((v, i) => [v - base[i], i])
    .sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < order.length && left > 0; k++, left--) base[order[k][1]]++;
  return base;
}

    }
  }

  const fmtScore = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
  const fmtPct = (v) => (v * 100).toFixed(0) + "%";
  const sign = (v) => (v >= 0 ? "pos" : "neg");

  function save() {
    try { localStorage.setItem(`ranks-basket-${U.key}`, JSON.stringify([...U.picked])); } catch {}
  }

  function toggle(symbol) {
    if (U.picked.has(symbol)) U.picked.delete(symbol);
    else U.picked.add(symbol);
    save();
    recomputeCorr();
    recomputeSectors();
    render();
  }

  /* ---------- weights ----------
     Three schemes over the same holdings. Equal and inverse-vol size off the
     volatility the Vol column already shows, so both stay checkable against the
     numbers on screen. HRP cannot be — it needs the whole covariance — so it
     runs off the 252-day return vectors instead, which is also the window its
     shrinkage and clustering are defined on. */
  let hrpCache = { key: "", w: null, capBound: false, delta: 0 };

  function hrpFor(rows) {
    const key = U.key + "|" + rows.map((s) => s.symbol).join(",");
    if (hrpCache.key !== key) {
      const input = rows.map((s) => ({
        u: U.vec.subarray(s.i * T, s.i * T + T),
        sd: s.sd > 0 ? s.sd : Math.max(s.vl[0], 1e-6),
      }));
      const out = hrpWeights(input);
      hrpCache = { key, w: out.w, capBound: out.capBound, delta: out.delta };
    }
    return hrpCache;
  }

  function weights(rows) {
    const n = rows.length;
    if (!n) return [];
    if (state.weight === "eq") return rows.map((s) => ({ s, w: 1 / n }));
    if (state.weight === "hrp") {
      const out = hrpFor(rows);
      return rows.map((s, i) => ({ s, w: out.w[i] }));
    }
    // Sizing uses the blended volatility — the displayed metric changes what
    // you are reading, not how the basket is built.
    const inv = rows.map((s) => 1 / Math.max(s.vl[0], 1e-6));
    const total = inv.reduce((a, b) => a + b, 0);
    return rows.map((s, i) => ({ s, w: inv[i] / total }));
  }

  /* ---------- controls ---------- */
  const sectorSel = document.getElementById("sector");

  function fillSectors() {
    sectorSel.textContent = "";
    const all = document.createElement("option");
    all.value = "";
    all.textContent = U.groupLabel;
    sectorSel.append(all);
    for (const name of U.groups) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      sectorSel.append(o);
    }
    sectorSel.value = state.sector;
  }
  fillSectors();
  sectorSel.addEventListener("change", () => { state.sector = sectorSel.value; shown = PAGE; render(); });

  let timer;
  document.getElementById("q").addEventListener("input", (e) => {
    clearTimeout(timer);
    const v = e.target.value.trim().toLowerCase();
    timer = setTimeout(() => { state.q = v; render(); }, 120);
  });

  for (const b of document.querySelectorAll("[data-metric]")) {
    b.addEventListener("click", () => { state.metric = +b.dataset.metric; render(); });
  }

  for (const b of document.querySelectorAll("[data-sort]")) {
    b.addEventListener("click", () => {
      // Same column taps flip direction; a new column opens on its natural one
      // — high score and return first, low volatility first.
      if (state.sort === b.dataset.sort) state.desc = !state.desc;
      else { state.sort = b.dataset.sort; state.desc = b.dataset.sort !== "vol"; }
      render();
    });
  }

  for (const b of document.querySelectorAll("[data-universe]")) {
    b.addEventListener("click", () => setUniverse(b.dataset.universe));
  }

  for (const b of document.querySelectorAll("[data-cap]")) {
    b.addEventListener("click", () => { state.cap = +b.dataset.cap; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-weight]")) {
    b.addEventListener("click", () => { state.weight = b.dataset.weight; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-display]")) {
    b.addEventListener("click", () => { state.display = b.dataset.display; saveFilters(); render(); });
  }

  document.getElementById("tab-settings").addEventListener("click", () => { state.view = "settings"; render(); });
  document.getElementById("tab-ranks").addEventListener("click", () => { state.view = "ranks"; render(); });
  document.getElementById("tab-basket").addEventListener("click", () => { state.view = "basket"; render(); });

  /* ---------- rendering ---------- */
  let shown = PAGE;

  function selected() {
    let out = U.items;
    // Filters only decide who is listed; scores are computed against the whole
    // universe and never move. The rank is positional, so it renumbers.
    if (state.cap && U.capRank) out = out.filter((s) => U.capRank[s.i] <= state.cap);
    if (state.sector) out = out.filter((s) => s.group === state.sector);
    if (state.q) {
      out = out.filter((s) =>
        s.symbol.toLowerCase().includes(state.q) || s.name.toLowerCase().includes(state.q));
    }
    const f = { score: sc, ret: rt, vol: vl }[state.sort];
    return out.slice().sort((a, b) => (state.desc ? f(b) - f(a) : f(a) - f(b)));
  }

  function cell(v, cls, sgn) {
    const el = document.createElement("span");
    el.className = "n" + (cls ? " " + cls : "");
    if (sgn) el.dataset.sign = sgn;
    el.textContent = v;
    return el;
  }

  function rowFor(s, ordinal, weight) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row " + (state.view === "basket" ? basketGrid() : "grid");
    b.setAttribute("aria-pressed", String(U.picked.has(s.symbol)));

    if (state.view !== "basket") {
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = ordinal;
      b.append(rank);
    }

    const id = document.createElement("span");
    id.className = "id";
    const tkr = document.createElement("b");
    tkr.textContent = s.symbol;

    const sub = document.createElement("span");
    sub.className = "sub";
    const mark = glyphFor(s.group);
    if (mark) sub.append(mark);
    const nm = document.createElement("i");
    nm.textContent = s.name;
    sub.append(nm);

    if (U.maxRho[s.i] >= CORR_FLAG && U.maxWith[s.i] >= 0) {
      const twin = U.items[U.maxWith[s.i]].symbol;
      const em = document.createElement("em");
      em.textContent = "≈" + U.maxRho[s.i].toFixed(2).slice(1) + " " + twin;
      em.title = `correlation ${U.maxRho[s.i].toFixed(2)} with ${twin}`;
      em.setAttribute("aria-label", `correlated ${U.maxRho[s.i].toFixed(2)} with ${twin}`);
      sub.append(em);
    }

    const share = U.share.get(s.k);
    if (share !== undefined) {
      const pct = Math.round(share * 100) + "%";
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.title = `${pct} of the basket is already ${s.group}`;
      dot.setAttribute("role", "img");
      dot.setAttribute("aria-label", `${pct} of the basket is already ${s.group}`);
      sub.append(dot);
    }
    id.append(tkr, sub);
    b.append(id);

    if (state.view === "basket") {
      b.append(cell(weight, "score"));
      b.append(cell(fmtScore(sc(s)), "", sign(sc(s))));
      b.append(cell(fmtPct(vl(s))));
    } else {
      b.append(cell(fmtScore(sc(s)), "score", sign(sc(s))));
      b.append(cell(fmtPct(rt(s))));
      b.append(cell(fmtPct(vl(s))));
    }

    b.addEventListener("click", () => toggle(s.symbol));
    return b;
  }

  function renderRanks() {
    const rows = selected();
    document.getElementById("meta").hidden = false;
    document.getElementById("count-n").textContent = rows.length.toLocaleString();
    const asof = document.getElementById("asof");
    asof.textContent = "";
    if (state.cap && U.hasCap) {
      const tag = document.createElement("em");
      tag.textContent = "TOP " + state.cap;
      asof.append(tag);
    }
    asof.append(U.asOf);

    const list = document.getElementById("list");
    list.textContent = "";
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing matches.";
      list.append(p);
      return;
    }

    const frag = document.createDocumentFragment();
    for (let i = 0; i < Math.min(shown, rows.length); i++) frag.append(rowFor(rows[i], i + 1));
    list.append(frag);

    if (rows.length > shown) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "more";
      more.textContent = `${rows.length - shown} more`;
      more.addEventListener("click", () => { shown += PAGE * 2; render(); });
      list.append(more);
    }
  }

  function renderBasket() {
    const rows = held();
    document.getElementById("meta").hidden = !rows.length;
    document.getElementById("count-n").textContent = rows.length;
    document.getElementById("asof").textContent = rows.length === 1 ? "name" : "names";

    const sum = document.getElementById("sum");
    const list = document.getElementById("list");
    sum.textContent = "";
    list.textContent = "";

    if (!rows.length) {
      sum.hidden = true;
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tap a row in Ranks to add it.";
      list.append(p);
      return;
    }
    sum.hidden = false;

    const w = weights(rows);
    w.sort((a, b) => sc(b.s) - sc(a.s));

    // Whole percents or whole dollars, apportioned so the column sums to
    // exactly 100% or exactly $10,000 — a column of weights is a thing readers
    // add up, and rounding each row on its own does not land on the total.
    const cash = state.display === "cash";
    const parts = apportion(w.map((x) => x.w), cash ? PORTFOLIO : 100);
    const fmtWeight = (i) => (cash ? "$" + parts[i].toLocaleString("en-US") : parts[i] + "%");
    let top = 0;
    for (let i = 1; i < w.length; i++) if (w[i].w > w[top].w) top = i;

    const avgScore = rows.reduce((t, s) => t + sc(s), 0) / rows.length;
    const wVol = w.reduce((t, x) => t + x.w * x.s.vl[0], 0);
    const line = (k, v) => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const a = document.createElement("span");
      a.textContent = k;
      const b = document.createElement("span");
      b.textContent = v;
      row.append(a, b);
      sum.append(row);
    };
    line("Avg " + METRICS[state.metric].toLowerCase(), fmtScore(avgScore));
    line("Weighted vol", fmtPct(wVol));
    line("Largest weight", fmtWeight(top));

    const counts = new Map();
    for (const it of rows) counts.set(it.group, (counts.get(it.group) ?? 0) + 1);
    for (const [name, n] of [...counts].sort((a, b) => b[1] - a[1])) line(name, n);

    const head = document.createElement("div");
    head.className = "head " + basketGrid();
    head.style.paddingLeft = "0";
    head.style.paddingRight = "0";
    head.style.marginTop = "16px";
    // "$10K" names the unit and the base the cash figures are sized against, in
    // the four characters the column already has.
    for (const [text, cls] of [["Holdings", "lbl l"], [cash ? "$10K" : "Wt", "lbl"], ["Score", "lbl"], ["Vol", "lbl"]]) {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      el.style.textAlign = cls.endsWith("l") ? "left" : "right";
      head.append(el);
    }
    sum.append(head);

    const frag = document.createDocumentFragment();
    w.forEach((x, i) => frag.append(rowFor(x.s, 0, fmtWeight(i))));
    list.append(frag);
  }

  const basketGrid = () => "grid-basket" + (state.display === "cash" ? " cash" : "");

  function renderSettings() {
    document.getElementById("meta").hidden = true;
    document.getElementById("list").textContent = "";
  }

  function render() {
    const view = state.view;
    const list = view === "ranks";
    document.getElementById("heading").textContent =
      view === "basket" ? "Basket" : view === "settings" ? "Settings" : "Ranks";
    document.getElementById("seek").hidden = !list;
    document.getElementById("head").hidden = !list;
    document.getElementById("sum").hidden = view !== "basket";
    document.getElementById("settings-panel").hidden = view !== "settings";
    document.getElementById("tab-ranks").setAttribute("aria-pressed", String(list));
    document.getElementById("tab-basket").setAttribute("aria-pressed", String(view === "basket"));
    document.getElementById("tab-settings").setAttribute("aria-pressed", String(view === "settings"));

    for (const b of document.querySelectorAll("[data-universe]")) {
      b.setAttribute("aria-pressed", String(b.dataset.universe === state.universe));
    }
    for (const b of document.querySelectorAll("[data-cap]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.cap === state.cap));
    }
    for (const b of document.querySelectorAll("[data-weight]")) {
      b.setAttribute("aria-pressed", String(b.dataset.weight === state.weight));
    }
    for (const b of document.querySelectorAll("[data-display]")) {
      b.setAttribute("aria-pressed", String(b.dataset.display === state.display));
    }
    // A fund has assets, not a capitalisation — the cutoff has nothing to rank.
    document.getElementById("cap-head").hidden = !U.hasCap;
    document.getElementById("cap-choice").hidden = !U.hasCap;

    for (const b of document.querySelectorAll("[data-metric]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.metric === state.metric));
    }
    document.getElementById("h-score").textContent = METRICS[state.metric];

    for (const b of document.querySelectorAll("[data-sort]")) {
      const on = b.dataset.sort === state.sort;
      b.setAttribute("aria-pressed", String(on));
      if (on) b.dataset.dir = state.desc ? "↓" : "↑";
    }

    document.getElementById("tab-basket").textContent =
      U.picked.size ? `Basket · ${U.picked.size}` : "Basket";

    if (view === "basket") renderBasket();
    else if (view === "settings") renderSettings();
    else renderRanks();
  }

  recomputeCorr();
  recomputeSectors();
  render();
</script>
