<title>Ranks — volatility-adjusted momentum</title>

<style>
  /* One typeface, two weights, hairlines, and colour on exactly one thing:
     the score. Neutrals carry a slight cool bias so the greys read as chosen
     rather than default. Both themes are defined token-level, covering all
     three viewer states (explicit light, explicit dark, unstamped system). */
  :root {
    --bg: #ffffff;
    --raise: #f7f8fa;
    --ink: #16181d;
    --ink-2: #4a4f59;
    --muted: #8a8f9a;
    --rule: #e9ebef;
    --rule-2: #d8dbe1;
    --pos: #12784a;
    --neg: #b03a2e;
    --sel: #f2f4f7;
    --flag: #9a5b12;
    --flag-bg: #f6efe4;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0d10;
      --raise: #131519;
      --ink: #eceef2;
      --ink-2: #b0b5be;
      --muted: #767c87;
      --rule: #1c1e24;
      --rule-2: #2a2d35;
      --pos: #46cf85;
      --neg: #ef6f60;
      --sel: #16181d;
      --flag: #e0a95c;
      --flag-bg: #221c12;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c0d10;
    --raise: #131519;
    --ink: #eceef2;
    --ink-2: #b0b5be;
    --muted: #767c87;
    --rule: #1c1e24;
    --rule-2: #2a2d35;
    --pos: #46cf85;
    --neg: #ef6f60;
    --sel: #16181d;
    --flag: #e0a95c;
    --flag-bg: #221c12;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 calc(52px + env(safe-area-inset-bottom));
  }

  .num { font-variant-numeric: tabular-nums; }

  :where(button, input, select):focus-visible {
    outline: 2px solid var(--ink-2);
    outline-offset: -2px;
  }

  /* ---------- header ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 16px 12px;
  }

  .title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.03em;
  }

  /* One run of grey read as a single string. Split it: the count is a figure,
     the date is a caption beneath it. */
  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    white-space: nowrap;
  }

  .meta b {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1.1;
  }

  .meta i {
    display: flex;
    align-items: center;
    gap: 5px;
    font-style: normal;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* The search row — named for what it does, now that Settings owns the
     filtering controls. It starts at 48px, not 16px, so its text lines up with
     the ticker column and the company names below rather than hanging off the
     left edge on its own. The right edge stays at 16px, matching where the
     numeric columns end. */
  .seek {
    display: flex;
    gap: 10px;
    padding: 0 16px 10px 48px;
  }

  .seek input,
  .seek select {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-bottom: 1px solid var(--rule-2);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    /* 16px exactly: iOS Safari zooms the whole viewport when a focused field is
       smaller than this, which shifts the layout out from under the reader. */
    font-size: 16px;
    padding: 4px 0;
    min-height: 32px;
  }

  /* The generic focus ring draws a box, which fights a design made of
     hairlines. These two fields state focus by owning their own rule instead. */
  .seek input:focus-visible,
  .seek select:focus-visible {
    outline: none;
    border-bottom-color: var(--ink);
    box-shadow: 0 1px 0 0 var(--ink);
  }

  .seek input { flex: 1; min-width: 0; }
  .seek input::placeholder { color: var(--muted); }
  .seek input::-webkit-search-cancel-button { display: none; }

  .pick { position: relative; flex: 0 0 auto; max-width: 48%; }
  .pick select { width: 100%; padding-right: 16px; text-overflow: ellipsis; }

  .pick::after {
    content: "";
    position: absolute;
    right: 2px;
    top: 13px;
    width: 5px;
    height: 5px;
    border-right: 1px solid var(--muted);
    border-bottom: 1px solid var(--muted);
    transform: rotate(45deg);
    pointer-events: none;
  }

  /* ---------- column headers; tapping one sorts by it ---------- */
  .head {
    display: grid;
    align-items: end;
    gap: 6px;
    padding: 0 16px 5px 0;
    border-bottom: 1px solid var(--rule-2);
  }

  .head button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 4px 0;
    font-family: inherit;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    text-align: right;
    white-space: nowrap;
  }

  .head .lbl {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 4px;
  }

  .head .lbl.l { text-align: left; }
  .head.grid .lbl:first-child { text-align: center; padding-left: 6px; }
  .head button[aria-pressed="true"] { color: var(--ink); }
  .head button[aria-pressed="true"]::after { content: attr(data-dir); margin-left: 3px; }

  /* ---------- rows ----------
     The rank column runs from the row's own left edge to 42px, and the cell is
     inset by the 6px gap, so the digits centre on 24px — exactly halfway to the
     ticker's left edge at 48px. */
  .grid { grid-template-columns: 42px minmax(0, 1fr) 46px 50px 42px; }
  .grid-hold { grid-template-columns: 42px minmax(0, 1fr) 46px 46px; }
  .grid-basket { grid-template-columns: minmax(0, 1fr) 46px 46px 42px; }
  /* "$1,000" needs more room than "10%"; two classes, so this beats .grid-basket */
  .grid-basket.cash { grid-template-columns: minmax(0, 1fr) 56px 44px 40px; }

  .list { display: flex; flex-direction: column; }

  /* A div rather than a button: the look-through affordance is itself a button,
     and a button inside a button is not valid HTML. Keyboard behaviour is
     restored by hand — see the keydown handler on the row. */
  .row {
    width: 100%;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: grid;
    align-items: center;
    gap: 6px;
    padding: 9px 16px 9px 0;
    min-height: 46px;
    box-sizing: border-box;
  }

  /* Holdings rows are a readout, not a control. */
  .row.static { cursor: default; }

  /* The look-through: a chevron drawn in rules, sitting on the name line so it
     costs no column. Vertical padding gives it a real tap target without
     changing the row's height. */
  .peek {
    appearance: none;
    border: 0;
    background: transparent;
    flex: 0 0 auto;
    padding: 11px 6px;
    margin: -11px -2px;
    cursor: pointer;
    line-height: 0;
  }

  .peek::after {
    content: "";
    display: block;
    width: 6px;
    height: 6px;
    border-top: 1.2px solid var(--muted);
    border-right: 1.2px solid var(--muted);
    transform: rotate(45deg);
  }

  .peek:hover::after { border-color: var(--ink); }

  /* two classes, so this beats .row's shorthand rather than racing it */
  .row.grid-basket { padding-left: 16px; }

  .row[aria-pressed="true"] { background: var(--sel); }

  .rank {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    text-align: center;
    padding-left: 6px;
  }

  .row[aria-pressed="true"] .rank { color: var(--ink-2); font-weight: 600; }

  .id { min-width: 0; }

  .id b {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  /* Name line: the company name gives way to the flags rather than pushing
     them into the numbers. */
  .sub {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    margin-top: 1px;
  }

  .sub i {
    font-style: normal;
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  /* Sector mark: identity, so it stays in the muted ink of the line it sits on. */
  .sub svg {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    opacity: .85;
  }

  .n {
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
  }

  .n.score { font-weight: 600; color: var(--ink); }
  .n.score[data-sign="pos"] { color: var(--pos); }
  .n.score[data-sign="neg"] { color: var(--neg); }

  .more {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    padding: 14px;
    cursor: pointer;
  }

  .empty {
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------- filters panel ---------- */
  .fgroup { padding: 4px 16px 0; }

  .fgroup h2 {
    margin: 18px 0 8px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .choice { display: flex; gap: 14px; align-items: center; }

  .choice button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 2px 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .choice button[aria-pressed="true"] {
    color: var(--ink);
    box-shadow: inset 0 -1.5px 0 var(--ink);
  }

  /* an active filter has to be visible from the list, not only from its tab */
  .meta em {
    font-style: normal;
    font-weight: 600;
    font-size: 9.5px;
    color: var(--flag);
    background: var(--flag-bg);
    border-radius: 3px;
    padding: 1.5px 4px;
    margin-right: 6px;
  }

  /* ---------- basket summary ---------- */
  .sum { padding: 4px 16px 0; }

  /* Actions read as text with a rule under them — the same vocabulary as the
     column headers, rather than a pair of filled buttons the design has
     nowhere else. */
  .acts {
    display: flex;
    gap: 18px;
    padding: 8px 0 2px;
  }

  .acts button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 3px 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    box-shadow: inset 0 -1.5px 0 var(--rule-2);
  }

  .acts button:hover { box-shadow: inset 0 -1.5px 0 var(--ink); }
  .acts button.quiet { color: var(--muted); }

  .sum-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }

  .sum-row:last-child { border-bottom: 0; }
  .sum-row span:first-child { color: var(--muted); white-space: nowrap; }
  .sum-row span:last-child { font-variant-numeric: tabular-nums; }

  /* Sector counts as marks rather than a stack of named rows: on a fourteen-name
     basket that was eleven rows, so the first holding sat below the fold. The
     glyphs are the ones already on every row, so the tally needs no legend. */
  /* Pairs bind tight and separate wide, so each mark reads as owning the number
     beside it. Healthcare's mark is a cross, and at an even spacing its entry
     reads as "+1" — one more — rather than one healthcare name. */
  .tally {
    display: flex;
    align-items: center;
    gap: 13px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .tally b {
    display: flex;
    align-items: center;
    gap: 1px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .tally svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    opacity: .8;
  }

  .sec-head {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 16px 4px;
    border-bottom: 1px solid var(--rule-2);
  }

  /* ---------- footer tabs ---------- */
  .tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    background: var(--bg);
    border-top: 1px solid var(--rule-2);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .tabs button {
    flex: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    min-height: 50px;
    cursor: pointer;
  }

  .tabs button[aria-pressed="true"] { color: var(--ink); }

  /* .filters and .head are flex/grid, which outranks the hidden attribute */
  [hidden] { display: none !important; }

  @media (min-width: 600px) {
    .shell { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); min-height: 100vh; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="title">
      <h1 id="heading">Ranks</h1>
      <span class="meta" id="meta" hidden><b id="count-n"></b><i id="asof"></i></span>
    </div>

    <div class="seek" id="seek">
      <input id="q" type="search" placeholder="search" aria-label="Search ticker or company" />
      <div class="pick">
        <select id="sector" aria-label="Sector"></select>
      </div>
    </div>

    <div class="head grid" id="head">
      <span class="lbl">#</span>
      <span class="lbl l">Ticker</span>
      <button type="button" data-sort="score" data-dir="↓" aria-pressed="true" id="h-score">Blend</button>
      <button type="button" data-sort="ret" data-dir="↓" aria-pressed="false">Ret</button>
      <button type="button" data-sort="vol" data-dir="↑" aria-pressed="false">Vol</button>
    </div>
  </header>

  <div class="fgroup" id="settings-panel" hidden>
    <h2>Universe</h2>
    <div class="choice" role="group" aria-label="Universe">
      <button type="button" data-universe="stocks" aria-pressed="true">Stocks</button>
      <button type="button" data-universe="etfs" aria-pressed="false">ETFs</button>
    </div>

    <h2>Weights</h2>
    <div class="choice" role="group" aria-label="Weighting">
      <button type="button" data-weight="eq" aria-pressed="false">Equal</button>
      <button type="button" data-weight="iv" aria-pressed="true" title="Inverse volatility: w proportional to 1/σ, on the volatility the Vol column shows">Inv vol</button>
    </div>

    <h2>Display</h2>
    <div class="choice" role="group" aria-label="Weight display">
      <button type="button" data-display="pct" aria-pressed="true">Percent</button>
      <button type="button" data-display="cash" aria-pressed="false" title="Cash needed per holding in a $10,000 portfolio">Cash</button>
    </div>

    <h2>Window</h2>
    <div class="choice" role="group" aria-label="Window start">
      <button type="button" data-metric="0" aria-pressed="true">Blend</button>
      <button type="button" data-metric="1" aria-pressed="false">12 mo</button>
      <button type="button" data-metric="2" aria-pressed="false">6 mo</button>
    </div>

    <h2>Skip</h2>
    <div class="choice" role="group" aria-label="Skip">
      <button type="button" data-skip="0" aria-pressed="false" title="No skip: the window runs to the latest close">0%</button>
      <button type="button" data-skip="1" aria-pressed="false" title="10 trading days, about half a month">50%</button>
      <button type="button" data-skip="2" aria-pressed="true" title="21 trading days, one trading month — the conventional 12-1 / 6-1 definition">100%</button>
    </div>

    <h2 id="cap-head">Market cap</h2>
    <div class="choice" id="cap-choice" role="group" aria-label="Market cap cutoff">
      <button type="button" data-cap="0" aria-pressed="true">All</button>
      <button type="button" data-cap="500" aria-pressed="false">Top 500</button>
    </div>
  </div>

  <div class="sum" id="sum" hidden></div>
  <main class="list" id="list"></main>
</div>

<nav class="tabs">
  <button type="button" id="tab-ranks" aria-pressed="true">Ranks</button>
  <button type="button" id="tab-basket" aria-pressed="false">Basket</button>
  <button type="button" id="tab-settings" aria-pressed="false">Settings</button>
</nav>

// Basket filler: walk a ranked list and take names that add something.
//
// This file is both a Node module (so `npm run test:select` can check it) and
// the page's selector: src/ranks-render.js inlines this source into the
// template, stripping only the export line at the bottom. Nothing here touches
// the DOM or imports anything.
//
// The rule, in order of how much work each part does:
//
//   1. Walk the ranking from the top. Rank is the whole point; the filter only
//      ever says no.
//   2. Reject a candidate whose MEAN correlation to what is already held
//      reaches `avg`. This does essentially all of the diversification work.
//   3. Reject a candidate that is a near-duplicate of any ONE holding — RAW
//      correlation above `veto`. This barely moves aggregate risk but stops the
//      basket holding the same thing twice, which matters for reasons variance
//      does not capture.
//   4. Stop at `want` names, or when the pool runs out. If the rule cannot find
//      enough it returns fewer. It never pads.
//
// Why those two tests and not the obvious alternatives, measured over the top
// 50 by selecting on one half-year and scoring on the next:
//
//   method                        effective bets, out of sample
//   top 20 by rank                        4.2
//   mean correlation < 0.12               6.7      <- the whole gain
//   max correlation < 0.35 only           4.7
//   cluster at 0.25 + sqrt(size) slots    4.5
//
// Clustering and max-thresholding look competitive in sample and mostly
// evaporate out of it. They are not wrong, they are weak: a duplicate test only
// excludes the handful of names that have a twin, so it cannot move an
// aggregate. The mean test reshapes the whole basket.
//
// Two details that are easy to get backwards:
//
// **The mean runs on shrunk correlations, the veto on raw ones.** Ledoit-Wolf
// pulls every correlation toward the average, which is right for a statistic
// you average over and wrong for "is this the same thing twice": at the
// shrinkage a half-year sample earns, MU/WDC reads 0.43 when it is really 0.66,
// and a veto set on shrunk numbers waves it through.
//
// **Padding to a target silently disables the filter.** Topping a short result
// up with the next-highest-ranked names puts back exactly what the rule
// rejected, which makes every threshold produce the same basket.

const AVG = 0.12;   // mean correlation to the held set
const VETO = 0.70;  // raw correlation with any single holding
const POOL = 50;    // how far down the ranking to consider
const WANT = 20;

/**
 * @param {{u: ArrayLike<number>}[]} rows Candidates in rank order; `u` is a
 *   centred, unit-L2-norm return vector, so uᵢ·uⱼ is the pair's correlation.
 * @param {{want?:number, avg?:number, veto?:number, held?:number[]}} [opts]
 *   `held` seeds the walk with candidates already owned: they constrain what
 *   can be added but are not returned again.
 * @returns {{picked:number[], skipped:{i:number,why:string,value:number,of:number}[], delta:number}}
 */
function fill(rows, opts = {}) {
  const want = opts.want ?? WANT;
  const avgMax = opts.avg ?? AVG;
  const veto = opts.veto ?? VETO;
  const held = (opts.held ?? []).slice();
  const n = rows.length;

  const picked = [];
  const skipped = [];
  if (!n) return { picked, skipped, delta: 0 };

  const raw = correlations(rows);
  const { corr, delta } = shrink(rows, raw);
  const basket = held.slice();

  for (let i = 0; i < n && basket.length < want; i++) {
    if (basket.includes(i)) continue;

    if (!basket.length) { picked.push(i); basket.push(i); continue; }

    // Duplicate test first, on raw correlations, so the reason reported is the
    // more specific of the two.
    let worst = -2;
    let twin = -1;
    for (const j of basket) {
      if (raw[i][j] > worst) { worst = raw[i][j]; twin = j; }
    }
    if (worst > veto) { skipped.push({ i, why: 'twin', value: worst, of: twin }); continue; }

    let mean = 0;
    for (const j of basket) mean += corr[i][j];
    mean /= basket.length;
    if (mean >= avgMax) { skipped.push({ i, why: 'overlap', value: mean, of: -1 }); continue; }

    picked.push(i);
    basket.push(i);
  }
  return { picked, skipped, delta };
}

/** Pairwise correlations — a dot product, since the vectors arrive unit-norm. */
function correlations(rows) {
  const n = rows.length;
  const T = rows[0].u.length;
  const C = Array.from({ length: n }, () => new Float64Array(n));
  for (let i = 0; i < n; i++) {
    C[i][i] = 1;
    for (let j = i + 1; j < n; j++) {
      let d = 0;
      for (let t = 0; t < T; t++) d += rows[i].u[t] * rows[j].u[t];
      C[i][j] = C[j][i] = d;
    }
  }
  return C;
}

/**
 * Ledoit & Wolf shrinkage toward constant correlation, on the candidates' own
 * matrix. The intensity is derived rather than tuned — a short or noisy sample
 * shrinks hard, a long clean one barely at all. Over 50 names and 252 days it
 * lands near 0.30; over 126 days near 0.44, the estimator noticing it has half
 * the evidence.
 *
 * Working on standardised series makes every variance 1, so the covariance
 * *is* the correlation matrix and the target is simply the average correlation
 * off the diagonal.
 */
function shrink(rows, C) {
  const n = rows.length;
  if (n < 3) return { corr: C, delta: 0 };
  const T = rows[0].u.length;

  // z has unit variance, so (1/T)·Σz_i z_j is the correlation directly
  const z = rows.map((r) => {
    const out = new Float64Array(T);
    const s = Math.sqrt(T);
    for (let t = 0; t < T; t++) out[t] = r.u[t] * s;
    return out;
  });

  let rbar = 0;
  let pairs = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { rbar += C[i][j]; pairs++; }
  rbar /= pairs;

  const piMat = Array.from({ length: n }, () => new Float64Array(n));
  let pi = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i; j < n; j++) {
      let acc = 0;
      for (let t = 0; t < T; t++) {
        const d = z[i][t] * z[j][t] - C[i][j];
        acc += d * d;
      }
      piMat[i][j] = piMat[j][i] = acc / T;
      pi += i === j ? piMat[i][j] : 2 * piMat[i][j];
    }
  }

  let rho = 0;
  for (let i = 0; i < n; i++) rho += piMat[i][i];
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      let tii = 0;
      let tjj = 0;
      for (let t = 0; t < T; t++) {
        const cross = z[i][t] * z[j][t] - C[i][j];
        tii += (z[i][t] * z[i][t] - 1) * cross;
        tjj += (z[j][t] * z[j][t] - 1) * cross;
      }
      rho += (rbar / 2) * (tii / T + tjj / T);
    }
  }

  let gamma = 0;
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const f = i === j ? 1 : rbar;
      const d = f - C[i][j];
      gamma += d * d;
    }
  }

  const delta = gamma > 0 ? Math.max(0, Math.min(1, (pi - rho) / gamma / T)) : 0;
  if (delta <= 0) return { corr: C, delta: 0 };

  const out = Array.from({ length: n }, () => new Float64Array(n));
  for (let i = 0; i < n; i++) {
    out[i][i] = 1;
    for (let j = i + 1; j < n; j++) out[i][j] = out[j][i] = delta * rbar + (1 - delta) * C[i][j];
  }
  return { corr: out, delta };
}

/** Effective number of independent positions in an equally weighted set. */
function effectiveBets(rows, idx) {
  if (idx.length < 2) return idx.length;
  const T = rows[0].u.length;
  let total = 0;
  for (const a of idx) {
    for (const b of idx) {
      let d = 0;
      for (let t = 0; t < T; t++) d += rows[a].u[t] * rows[b].u[t];
      total += d;
    }
  }
  return total > 0 ? (idx.length * idx.length) / total : idx.length;
}




  /* ---------- return vectors ----------
     Every item ships 252 standardised daily log returns as int8. Re-centre and
     re-normalise on decode and the dot product of two vectors is exactly their
     correlation. Both universes use the identical encoding, so one decoder
     serves both. */
  function decodeVectors(items) {
    const N = items.length;
    const VEC = new Float32Array(N * T);
    const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    const idx = new Uint8Array(128);
    for (let i = 0; i < 64; i++) idx[B64.charCodeAt(i)] = i;

    for (let s = 0; s < N; s++) {
      const str = items[s].c;
      const off = s * T;
      let out = 0;
      for (let i = 0; i + 3 < str.length && out < T; i += 4) {
        const n = (idx[str.charCodeAt(i)] << 18) | (idx[str.charCodeAt(i + 1)] << 12) |
                  (idx[str.charCodeAt(i + 2)] << 6) | idx[str.charCodeAt(i + 3)];
        for (const byte of [(n >> 16) & 255, (n >> 8) & 255, n & 255]) {
          if (out < T) VEC[off + out++] = byte > 127 ? byte - 256 : byte;
        }
      }
      let mean = 0;
      for (let t = 0; t < T; t++) mean += VEC[off + t];
      mean /= T;
      let ss = 0;
      for (let t = 0; t < T; t++) { VEC[off + t] -= mean; ss += VEC[off + t] * VEC[off + t]; }
      const norm = Math.sqrt(ss) || 1;
      for (let t = 0; t < T; t++) VEC[off + t] /= norm;
    }
    return VEC;
  }

  /**
   * Whole units that sum to exactly `total` — largest remainder, so 100% of a
   * basket reads as 100 and a $10,000 portfolio adds up to $10,000. Rounding
   * each row on its own does not, and a column of weights is a thing readers
   * add up.
   */
  function apportion(weights, total) {
    const raw = weights.map((w) => w * total);
    const base = raw.map(Math.floor);
    let left = Math.round(total - base.reduce((a, b) => a + b, 0));
    const order = raw.map((v, i) => [v - base[i], i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; k < order.length && left > 0; k++, left--) base[order[k][1]]++;
    return base;
  }

  /* A window is two edges. **Window** picks where it opens — 12 months back, 6
     months back, or the blend of both — and **Skip** picks how far short of
     today it closes. Every name ships annualised return and volatility at each
     combination, flattened skip-major; score and blend are derived here.

     The skip is the "-1" in 12-1: standard practice, because the last few weeks
     of a stock's return tend to mean-revert and would otherwise mix a reversal
     signal into a momentum one. It is worth being able to switch off. GDX ranks
     81st of 89 on a window that closed a month ago and is up 23% since — a fact
     about the measurement, not about the fund. */
  const METRICS = ["Blend", "12 mo", "6 mo"];
  const SKIPS = ["0%", "50%", "100%"];
  const SKIP_DAYS = [0, 10, 21];

  // metric 1 = the 12-month lookback, 2 = the 6-month one, 0 = their mean
  const pick = (a) => {
    const base = state.skip * 2;
    if (state.metric === 1) return a[base];
    if (state.metric === 2) return a[base + 1];
    return (a[base] + a[base + 1]) / 2;
  };
  const rt = (s) => pick(s.rt);
  const vl = (s) => pick(s.vl);
  // Score is a return over a volatility, so it is a division rather than a
  // third shipped array. The blend averages the two lookbacks' scores — not
  // their returns over their volatilities, which is a different number.
  const sc = (s) => {
    const base = state.skip * 2;
    if (state.metric === 1) return s.rt[base] / s.vl[base];
    if (state.metric === 2) return s.rt[base + 1] / s.vl[base + 1];
    return (s.rt[base] / s.vl[base] + s.rt[base + 1] / s.vl[base + 1]) / 2;
  };

  /* ---------- a universe is everything derived from one item list ----------
     Switching between stocks and funds swaps this whole object, so nothing
     downstream has to know which one it is holding. */
  function buildUniverse(key) {
    const src = UNIVERSES[key];
    const items = src.items.map((it, i) => ({ ...it, i, group: src.groups[it.k] }));
    const N = items.length;

    // "Top 500 largest" is a rank, not a dollar line: an absolute threshold
    // drifts as the market moves, a rank does not. Funds have no capitalisation,
    // so they get no ranking and the setting hides itself.
    let capRank = null;
    if (src.hasCap) {
      capRank = new Int32Array(N);
      items.map((it) => it.i).sort((a, b) => items[b].m - items[a].m)
        .forEach((idx, i) => { capRank[idx] = i + 1; });
    }

    const picked = new Set();
    try {
      for (const t of JSON.parse(localStorage.getItem(`ranks-basket-${key}`) ?? "[]")) picked.add(t);
    } catch {}

    return {
      key, items, N, picked, capRank,
      label: src.label,
      groupLabel: src.groupLabel,
      groups: src.groups,
      hasCap: src.hasCap,
      vec: decodeVectors(src.items),
      asOf: src.asOf ?? DATA.asOf,
    };
  }
  /* ---------- state ---------- */
  const state = {
    view: "ranks", sort: "score", desc: true, q: "", sector: "",
    metric: 0, skip: 2, cap: 0, universe: "stocks", weight: "iv", display: "pct",
    peek: null,
  };

  const WEIGHTS = ["eq", "iv"];
  const FILTER_KEY = "ranks-filters";
  try {
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY) ?? "{}");
    if (saved.cap === 500) state.cap = 500;
    if (saved.skip === 0 || saved.skip === 1) state.skip = saved.skip;
    if (saved.metric === 1 || saved.metric === 2) state.metric = saved.metric;
    if (saved.universe && UNIVERSES[saved.universe]) state.universe = saved.universe;
    if (saved.weight === "hrp") state.weight = "iv"; // the setting it replaced
    else if (WEIGHTS.includes(saved.weight)) state.weight = saved.weight;
    if (saved.display === "cash") state.display = "cash";
  } catch {}

  function saveFilters() {
    try {
      localStorage.setItem(FILTER_KEY, JSON.stringify({
        cap: state.cap, universe: state.universe, weight: state.weight,
        display: state.display, metric: state.metric, skip: state.skip,
      }));
    } catch {}
  }

  let U = buildUniverse(state.universe);

  function setUniverse(key) {
    if (key === state.universe) return;
    state.universe = key;
    state.peek = null;
    U = buildUniverse(key);
    // A sector name is not a theme name; carrying the old selection across would
    // silently match nothing.
    state.sector = "";
    fillSectors();
    saveFilters();
    shown = PAGE;
    render();
  }

  const held = () => U.items.filter((it) => U.picked.has(it.symbol));

  const fmtScore = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
  const fmtPct = (v) => (v * 100).toFixed(0) + "%";
  const sign = (v) => (v >= 0 ? "pos" : "neg");

  function save() {
    try { localStorage.setItem(`ranks-basket-${U.key}`, JSON.stringify([...U.picked])); } catch {}
  }

  function toggle(symbol) {
    if (U.picked.has(symbol)) U.picked.delete(symbol);
    else U.picked.add(symbol);
    save();
    render();
  }

  /* ---------- weights ----------
     Both size off numbers already on screen, so either can be checked against
     the list with a pencil. */
  function weights(rows) {
    const n = rows.length;
    if (!n) return [];
    if (state.weight === "eq") return rows.map((s) => ({ s, w: 1 / n }));
    // Sizing uses the blended volatility — the displayed metric changes what
    // you are reading, not how the basket is built.
    const inv = rows.map((s) => 1 / Math.max(vl(s), 1e-6));
    const total = inv.reduce((a, b) => a + b, 0);
    return rows.map((s, i) => ({ s, w: inv[i] / total }));
  }

  /* ---------- filling the basket ----------
     The pool is the list as displayed, so an active sector, cap or window
     filter narrows what can be added. Names already held seed the walk: they
     constrain what comes next without being offered again. */
  function fillBasket() {
    const pool = selected().filter((s) => !U.picked.has(s.symbol)).slice(0, POOL);
    const owned = held();
    if (owned.length >= WANT || !pool.length) return;

    const candidates = [...owned, ...pool];
    const rows = candidates.map((s) => ({ u: U.vec.subarray(s.i * T, s.i * T + T) }));
    const { picked } = fill(rows, { want: WANT, held: owned.map((_, k) => k) });
    for (const k of picked) U.picked.add(candidates[k].symbol);

    save();
    render();
  }

  function clearBasket() {
    U.picked.clear();
    save();
    render();
  }

  /* ---------- controls ---------- */
  const sectorSel = document.getElementById("sector");

  function fillSectors() {
    sectorSel.textContent = "";
    const all = document.createElement("option");
    all.value = "";
    all.textContent = U.groupLabel;
    sectorSel.append(all);
    for (const name of U.groups) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      sectorSel.append(o);
    }
    sectorSel.value = state.sector;
  }
  fillSectors();
  sectorSel.addEventListener("change", () => { state.sector = sectorSel.value; shown = PAGE; render(); });

  let timer;
  document.getElementById("q").addEventListener("input", (e) => {
    clearTimeout(timer);
    const v = e.target.value.trim().toLowerCase();
    timer = setTimeout(() => { state.q = v; render(); }, 120);
  });

  for (const b of document.querySelectorAll("[data-metric]")) {
    b.addEventListener("click", () => { state.metric = +b.dataset.metric; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-skip]")) {
    b.addEventListener("click", () => { state.skip = +b.dataset.skip; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-sort]")) {
    b.addEventListener("click", () => {
      // Same column taps flip direction; a new column opens on its natural one
      // — high score and return first, low volatility first.
      if (state.sort === b.dataset.sort) state.desc = !state.desc;
      else { state.sort = b.dataset.sort; state.desc = b.dataset.sort !== "vol"; }
      render();
    });
  }

  for (const b of document.querySelectorAll("[data-universe]")) {
    b.addEventListener("click", () => setUniverse(b.dataset.universe));
  }

  for (const b of document.querySelectorAll("[data-cap]")) {
    b.addEventListener("click", () => { state.cap = +b.dataset.cap; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-weight]")) {
    b.addEventListener("click", () => { state.weight = b.dataset.weight; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-display]")) {
    b.addEventListener("click", () => { state.display = b.dataset.display; saveFilters(); render(); });
  }

  document.getElementById("tab-settings").addEventListener("click", () => { state.view = "settings"; render(); });
  document.getElementById("tab-ranks").addEventListener("click", () => {
    state.view = "ranks";
    state.peek = null;
    render();
  });
  document.getElementById("tab-basket").addEventListener("click", () => { state.view = "basket"; render(); });

  /* ---------- rendering ---------- */
  let shown = PAGE;

  function selected() {
    let out = U.items;
    // Filters only decide who is listed; scores are computed against the whole
    // universe and never move. The rank is positional, so it renumbers.
    if (state.cap && U.capRank) out = out.filter((s) => U.capRank[s.i] <= state.cap);
    if (state.sector) out = out.filter((s) => s.group === state.sector);
    if (state.q) {
      out = out.filter((s) =>
        s.symbol.toLowerCase().includes(state.q) || s.name.toLowerCase().includes(state.q));
    }
    const f = { score: sc, ret: rt, vol: vl }[state.sort];
    return out.slice().sort((a, b) => (state.desc ? f(b) - f(a) : f(a) - f(b)));
  }

  function cell(v, cls, sgn) {
    const el = document.createElement("span");
    el.className = "n" + (cls ? " " + cls : "");
    if (sgn) el.dataset.sign = sgn;
    el.textContent = v;
    return el;
  }

  function rowFor(s, ordinal, weight) {
    const b = document.createElement("div");
    b.setAttribute("role", "button");
    b.tabIndex = 0;
    b.className = "row " + (state.view === "basket" ? basketGrid() : "grid");
    b.setAttribute("aria-pressed", String(U.picked.has(s.symbol)));

    if (state.view !== "basket") {
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = ordinal;
      b.append(rank);
    }

    const id = document.createElement("span");
    id.className = "id";
    const tkr = document.createElement("b");
    tkr.textContent = s.symbol;

    const sub = document.createElement("span");
    sub.className = "sub";
    const mark = glyphFor(s.group);
    if (mark) sub.append(mark);
    // An empty name means it tidied down to the ticker; the line is dropped
    // rather than repeating what the row already says.
    if (s.name) {
      const nm = document.createElement("i");
      nm.textContent = s.name;
      sub.append(nm);
    }

    // The row selects; the chevron looks through.
    if (s.h && state.view !== "basket") {
      const peek = document.createElement("button");
      peek.type = "button";
      peek.className = "peek";
      peek.title = `${s.symbol} holdings`;
      peek.setAttribute("aria-label", `Show ${s.symbol} holdings`);
      peek.addEventListener("click", (e) => { e.stopPropagation(); openHoldings(s.symbol); });
      sub.append(peek);
    }

    id.append(tkr, sub);
    b.append(id);

    if (state.view === "basket") {
      b.append(cell(weight, "score"));
      b.append(cell(fmtScore(sc(s)), "", sign(sc(s))));
      b.append(cell(fmtPct(vl(s))));
    } else {
      b.append(cell(fmtScore(sc(s)), "score", sign(sc(s))));
      b.append(cell(fmtPct(rt(s))));
      b.append(cell(fmtPct(vl(s))));

    }

    b.addEventListener("click", () => toggle(s.symbol));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      toggle(s.symbol);
    });
    return b;
  }

  function renderRanks() {
    const rows = selected();
    document.getElementById("meta").hidden = false;
    document.getElementById("count-n").textContent = rows.length.toLocaleString();
    const asof = document.getElementById("asof");
    asof.textContent = "";
    if (state.cap && U.hasCap) {
      const tag = document.createElement("em");
      tag.textContent = "TOP " + state.cap;
      asof.append(tag);
    }
    if (state.skip !== 2) {
      const tag = document.createElement("em");
      tag.textContent = "SKIP " + SKIPS[state.skip];
      tag.title = SKIP_DAYS[state.skip] + " trading days skipped";
      asof.append(tag);
    }
    asof.append(U.asOf);

    const list = document.getElementById("list");
    list.textContent = "";
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing matches.";
      list.append(p);
      return;
    }

    const frag = document.createDocumentFragment();
    for (let i = 0; i < Math.min(shown, rows.length); i++) frag.append(rowFor(rows[i], i + 1));
    list.append(frag);

    if (rows.length > shown) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "more";
      more.textContent = `${rows.length - shown} more`;
      more.addEventListener("click", () => { shown += PAGE * 2; render(); });
      list.append(more);
    }
  }

  function renderBasket() {
    const rows = held();
    document.getElementById("meta").hidden = !rows.length;
    document.getElementById("count-n").textContent = rows.length;
    document.getElementById("asof").textContent = rows.length === 1 ? "name" : "names";

    const sum = document.getElementById("sum");
    const list = document.getElementById("list");
    sum.textContent = "";
    list.textContent = "";

    sum.hidden = false;
    sum.append(basketActions(rows.length));

    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tap a row in Ranks to add it, or fill it from the list.";
      list.append(p);
      return;
    }

    const w = weights(rows);
    w.sort((a, b) => sc(b.s) - sc(a.s));

    // Whole percents or whole dollars, apportioned so the column sums to
    // exactly 100% or exactly $10,000 — a column of weights is a thing readers
    // add up, and rounding each row on its own does not land on the total.
    const cash = state.display === "cash";
    const parts = apportion(w.map((x) => x.w), cash ? PORTFOLIO : 100);
    const fmtWeight = (i) => (cash ? "$" + parts[i].toLocaleString("en-US") : parts[i] + "%");
    let top = 0;
    for (let i = 1; i < w.length; i++) if (w[i].w > w[top].w) top = i;

    const avgScore = rows.reduce((t, s) => t + sc(s), 0) / rows.length;
    const wVol = w.reduce((t, x) => t + x.w * vl(x.s), 0);
    const line = (k, v) => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const a = document.createElement("span");
      a.textContent = k;
      const b = document.createElement("span");
      b.textContent = v;
      row.append(a, b);
      sum.append(row);
    };
    line("Avg " + METRICS[state.metric].toLowerCase(), fmtScore(avgScore));
    line("Weighted vol", fmtPct(wVol));
    line("Largest weight", fmtWeight(top));

    // One row, marks descending by count. The names are on the holdings below
    // and the marks match them, so spelling each out was eleven rows of repeat.
    const counts = new Map();
    for (const it of rows) counts.set(it.group, (counts.get(it.group) ?? 0) + 1);
    const ordered = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

    const row = document.createElement("div");
    row.className = "sum-row";
    const key = document.createElement("span");
    key.textContent = ordered.length + (U.key === "etfs" ? " themes" : " sectors");
    const tally = document.createElement("span");
    tally.className = "tally";
    for (const [name, n] of ordered) {
      const cell = document.createElement("b");
      const mark = glyphFor(name);
      if (mark) cell.append(mark);
      const num = document.createElement("span");
      num.textContent = n;
      cell.append(num);
      cell.title = `${name}: ${n}`;
      tally.append(cell);
    }
    row.append(key, tally);
    sum.append(row);

    const head = document.createElement("div");
    head.className = "head " + basketGrid();
    head.style.paddingLeft = "0";
    head.style.paddingRight = "0";
    head.style.marginTop = "16px";
    // "$10K" names the unit and the base the cash figures are sized against, in
    // the four characters the column already has.
    for (const [text, cls] of [["Holdings", "lbl l"], [cash ? "$10K" : "Wt", "lbl"], ["Score", "lbl"], ["Vol", "lbl"]]) {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      el.style.textAlign = cls.endsWith("l") ? "left" : "right";
      head.append(el);
    }
    sum.append(head);

    const frag = document.createDocumentFragment();
    w.forEach((x, i) => frag.append(rowFor(x.s, 0, fmtWeight(i))));
    list.append(frag);
  }

  const basketGrid = () => "grid-basket" + (state.display === "cash" ? " cash" : "");

  /** Fill and Clear, above the summary. Fill hides once the basket is full. */
  function basketActions(count) {
    const bar = document.createElement("div");
    bar.className = "acts";
    if (count < WANT) {
      const f = document.createElement("button");
      f.type = "button";
      f.id = "act-fill";
      f.textContent = count ? `Fill to ${WANT}` : `Fill ${WANT}`;
      f.title = `Walk the ${U.label.toLowerCase()} list from the top, taking names whose mean correlation to the basket stays under ${AVG} and that duplicate nothing already held`;
      f.addEventListener("click", fillBasket);
      bar.append(f);
    }
    if (count) {
      const c = document.createElement("button");
      c.type = "button";
      c.id = "act-clear";
      c.className = "quiet";
      c.textContent = "Clear";
      c.addEventListener("click", clearBasket);
      bar.append(c);
    }
    return bar;
  }


  /* ---------- look-through ----------
     A fund's top holdings, resolved against the stock universe. Rank and score
     follow the metric switch, so what you read here is the same number the
     stock list would show. */
  const rankCache = new Map();

  function stockRanks() {
    const key = state.metric + ":" + state.skip;
    if (rankCache.has(key)) return rankCache.get(key);
    const items = UNIVERSES.stocks.items;
    const order = items.map((_, i) => i).sort((a, b) => sc(items[b]) - sc(items[a]));
    const rank = new Int32Array(items.length);
    order.forEach((idx, i) => { rank[idx] = i + 1; });
    rankCache.set(key, rank);
    return rank;
  }

  function openHoldings(symbol) {
    state.peek = symbol;
    state.view = "holdings";
    render();
  }

  function renderHoldings() {
    const fund = U.items.find((it) => it.symbol === state.peek);
    const sum = document.getElementById("sum");
    const list = document.getElementById("list");
    sum.textContent = "";
    list.textContent = "";

    if (!fund || !fund.h) { state.view = "ranks"; render(); return; }

    const stocks = UNIVERSES.stocks.items;
    const rank = stockRanks();
    const listed = fund.h.reduce((t, [, wt]) => t + wt, 0);

    document.getElementById("meta").hidden = false;
    document.getElementById("count-n").textContent = fund.h.length;
    document.getElementById("asof").textContent = "holdings";

    const line = (k, v, cls) => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const a = document.createElement("span");
      a.textContent = k;
      const b = document.createElement("span");
      b.textContent = v;
      if (cls) b.className = cls;
      row.append(a, b);
      sum.append(row);
    };

    // The fund's own score against its holdings' — the gap is the whole point.
    // A fund of 70 names carries a fraction of its average constituent's
    // volatility, and the score is a return divided by exactly that.
    const matched = fund.h.filter(([, , i]) => i >= 0);
    const mw = matched.reduce((t, [, wt]) => t + wt, 0);
    line(fund.symbol + " blend", fmtScore(sc(fund)));
    if (mw > 0) {
      const wScore = matched.reduce((t, [, wt, i]) => t + wt * sc(stocks[i]), 0) / mw;
      const wVol = matched.reduce((t, [, wt, i]) => t + wt * vl(stocks[i]), 0) / mw;
      line("Holdings blend", fmtScore(wScore));
      line("Holdings vol", fmtPct(wVol) + " vs " + fmtPct(vl(fund)));
    }
    line("Listed weight", listed.toFixed(1) + "% of fund");

    const head = document.createElement("div");
    head.className = "head grid-hold";
    head.style.paddingLeft = "0";
    head.style.paddingRight = "0";
    head.style.marginTop = "16px";
    for (const [text, cls] of [["#", "lbl"], ["Holding", "lbl l"], ["Wt", "lbl"], [METRICS[state.metric], "lbl"]]) {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      el.style.textAlign = cls.endsWith("l") ? "left" : cls === "lbl" && text === "#" ? "center" : "right";
      head.append(el);
    }
    sum.append(head);

    const frag = document.createDocumentFragment();
    for (const [sym, wt, i, note] of fund.h) {
      const row = document.createElement("div");
      row.className = "row static grid-hold";

      const r = document.createElement("span");
      r.className = "rank";
      r.textContent = i >= 0 ? rank[i] : "—";
      row.append(r);

      const id = document.createElement("span");
      id.className = "id";
      const tkr = document.createElement("b");
      tkr.textContent = sym;
      const sub = document.createElement("span");
      sub.className = "sub";
      // A miss is a fact about the fund's book, so it is marked rather than
      // hidden — and it says only what is known. Some are under the $25M
      // liquidity floor; CRAK's are foreign lines that were never candidates.
      const label = i >= 0 ? stocks[i].name : note;
      if (label) {
        const nm = document.createElement("i");
        nm.textContent = label;
        sub.append(nm);
      }
      id.append(tkr, sub);
      row.append(id);

      row.append(cell(wt.toFixed(2) + "%"));
      row.append(i >= 0
        ? cell(fmtScore(sc(stocks[i])), "score", sign(sc(stocks[i])))
        : cell("—"));
      frag.append(row);
    }
    list.append(frag);
  }

  function renderSettings() {
    document.getElementById("meta").hidden = true;
    document.getElementById("list").textContent = "";
  }

  function render() {
    const view = state.view;
    const list = view === "ranks";
    const peek = view === "holdings";
    document.getElementById("heading").textContent =
      view === "basket" ? "Basket" : view === "settings" ? "Settings" : peek ? state.peek : "Ranks";
    document.getElementById("seek").hidden = !list;
    document.getElementById("head").hidden = !list;
    document.getElementById("sum").hidden = !(view === "basket" || peek);
    document.getElementById("settings-panel").hidden = view !== "settings";
    // The look-through is reached from Ranks and returns there, so the Ranks
    // tab stays lit rather than leaving no tab selected.
    document.getElementById("tab-ranks").setAttribute("aria-pressed", String(list || peek));
    document.getElementById("tab-basket").setAttribute("aria-pressed", String(view === "basket"));
    document.getElementById("tab-settings").setAttribute("aria-pressed", String(view === "settings"));

    for (const b of document.querySelectorAll("[data-universe]")) {
      b.setAttribute("aria-pressed", String(b.dataset.universe === state.universe));
    }
    for (const b of document.querySelectorAll("[data-cap]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.cap === state.cap));
    }
    for (const b of document.querySelectorAll("[data-weight]")) {
      b.setAttribute("aria-pressed", String(b.dataset.weight === state.weight));
    }
    for (const b of document.querySelectorAll("[data-display]")) {
      b.setAttribute("aria-pressed", String(b.dataset.display === state.display));
    }
    // A fund has assets, not a capitalisation — the cutoff has nothing to rank.
    document.getElementById("cap-head").hidden = !U.hasCap;
    document.getElementById("cap-choice").hidden = !U.hasCap;

    for (const b of document.querySelectorAll("[data-metric]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.metric === state.metric));
    }
    for (const b of document.querySelectorAll("[data-skip]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.skip === state.skip));
    }
    document.getElementById("h-score").textContent = METRICS[state.metric];

    for (const b of document.querySelectorAll("[data-sort]")) {
      const on = b.dataset.sort === state.sort;
      b.setAttribute("aria-pressed", String(on));
      if (on) b.dataset.dir = state.desc ? "↓" : "↑";
    }

    document.getElementById("tab-basket").textContent =
      U.picked.size ? `Basket · ${U.picked.size}` : "Basket";

    if (view === "basket") renderBasket();
    else if (view === "settings") renderSettings();
    else if (peek) renderHoldings();
    else renderRanks();
  }

  render();
</script>
