name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The dataset is committed, so the whole suite runs without network
      # access or an API key: analytics maths, independent recomputation from
      # the raw bar files, the app data layer, and screen render smoke tests.
      - run: npm test
