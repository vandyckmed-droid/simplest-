<title>Momentum Desk — volatility-adjusted 12-1 / 6-1</title>

<style>
  /* Single-theme, Robinhood-style dark: true-black ground, green/red signal,
     pill controls. Every colour is painted explicitly so the page holds the
     same look on any host theme. Sign never rides on colour alone: the bar
     runs left/right of a centre zero line and every figure carries its own
     +/− (green/red is the classic deutan-confusable pair). */
  :root {
    --bg: #000000;
    --surface: #131316;
    --surface-sunk: #0a0a0c;
    --ink: #f5f5f7;
    --ink-2: #b9b9c0;
    --muted: #77777f;
    --line: #232328;
    --line-soft: #1a1a1e;
    --axis: #45454d;
    --pos: #00c805;
    --neg: #ff5000;
    --track: #1d1d22;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    /* room for the fixed watchlist bar */
    padding: 0 0 calc(74px + env(safe-area-inset-bottom));
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .num { font-variant-numeric: tabular-nums; }

  :where(button, input, select):focus-visible {
    outline: 2px solid var(--pos);
    outline-offset: 2px;
    border-radius: 999px;
  }

  /* ---------- sticky header ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px 10px;
  }

  .masthead h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
    white-space: nowrap;
    margin: 0;
  }

  .masthead .eyebrow { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .controls {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
  }

  /* group dropdown: native select in a pill, custom caret */
  .pick {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .pick select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    min-height: 36px;
    padding: 0 26px 0 13px;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .pick::after {
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 7px;
    height: 7px;
    margin-top: -5px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg);
    pointer-events: none;
  }

  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: 999px;
    background: var(--surface);
    flex: 0 0 auto;
  }

  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    padding: 0 10px;
    min-height: 32px;
    border-radius: 999px;
    cursor: pointer;
  }

  .seg button[aria-pressed="true"] { background: var(--ink); color: #000000; }

  .dir {
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    min-height: 36px;
    min-width: 36px;
    padding: 0 10px;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .row2 {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
  }

  .search {
    flex: 1;
    min-width: 0;
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    padding: 0 13px;
    min-height: 36px;
  }

  .search::placeholder { color: var(--muted); }

  /* ---------- summary strip ---------- */
  .summary {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line-soft);
  }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
  }

  .stat .k { display: block; }
  .stat .v {
    display: block;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.02em;
    margin-top: 1px;
  }

  .hist {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 30px;
  }

  .hist i {
    flex: 1;
    min-height: 1px;
    border-radius: 2px 2px 0 0;
    background: var(--track);
    display: block;
  }

  .hist i[data-sign="pos"] { background: var(--pos); opacity: .8; }
  .hist i[data-sign="neg"] { background: var(--neg); opacity: .8; }

  .hist-axis {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 3px;
    margin-top: 2px;
  }

  .hist-axis span { font-size: 9.5px; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ---------- ranked list; tap a row to add/remove it from the watchlist ---------- */
  .list { display: flex; flex-direction: column; }

  .row {
    appearance: none;
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line-soft);
    background: var(--bg);
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) auto;
    column-gap: 10px;
    row-gap: 3px;
    padding: 10px 16px 12px;
    min-height: 56px;
  }

  .row[aria-pressed="true"] {
    background: var(--surface-sunk);
    box-shadow: inset 2px 0 0 var(--pos);
  }

  .rank {
    grid-area: 1 / 1 / 4 / 2;
    align-self: center;
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
    color: var(--muted);
    text-align: right;
  }

  .row[aria-pressed="true"] .rank { color: var(--pos); font-weight: 700; }

  .tkr {
    grid-area: 1 / 2 / 2 / 3;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -.01em;
    align-self: center;
  }

  .meta {
    grid-area: 2 / 2 / 3 / 4;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 11px;
    color: var(--ink-2);
  }

  .meta b {
    font-weight: 400;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* sector chip: abbreviation + hue; the text is the identity, the colour a
     scanning aid */
  .sec {
    flex: 0 0 auto;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .07em;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 999px;
    color: var(--sec, var(--muted));
    background: color-mix(in srgb, var(--sec, var(--muted)) 14%, transparent);
  }

  .val {
    grid-area: 1 / 3 / 2 / 4;
    align-self: center;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: right;
  }

  .val[data-sign="pos"] { color: var(--pos); }
  .val[data-sign="neg"] { color: var(--neg); }

  /* zero-anchored diverging bar for the ranked metric */
  .bar {
    grid-area: 3 / 2 / 4 / 4;
    position: relative;
    height: 5px;
    background: var(--track);
    border-radius: 999px;
    margin-top: 3px;
  }

  .bar::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -3px;
    bottom: -3px;
    width: 1px;
    background: var(--axis);
  }

  .bar u {
    position: absolute;
    top: 0;
    bottom: 0;
    display: block;
    border-radius: 999px;
  }

  .bar u[data-sign="pos"] { left: 50%; background: var(--pos); }
  .bar u[data-sign="neg"] { right: 50%; background: var(--neg); }

  @media (prefers-reduced-motion: no-preference) {
    .bar u { transition: width .18s ease; }
  }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }

  .colophon {
    padding: 14px 16px;
    font-size: 10px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* ---------- watchlist bar ---------- */
  .wl {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    background: rgba(10, 10, 12, .92);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }

  .wl-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wl-stats {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    white-space: nowrap;
    overflow: hidden;
  }

  .wl-stats .k {
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }

  .wl-stats .v {
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .wl-stats .v[data-sign="pos"] { color: var(--pos); }
  .wl-stats .v[data-sign="neg"] { color: var(--neg); }

  .wl button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    min-height: 32px;
    padding: 0 12px;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .wl button[aria-pressed="true"] { background: var(--ink); color: #000000; }
  .wl button:disabled { opacity: .4; cursor: default; }

  @media (min-width: 600px) {
    .shell { border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); min-height: 100vh; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="masthead">
      <h1>Momentum Desk</h1>
      <span class="eyebrow" id="asof"></span>
    </div>

    <div class="controls">
      <div class="pick">
        <select id="group" aria-label="Industry group"></select>
      </div>
      <div class="seg" role="group" aria-label="Rank by">
        <button type="button" data-sort="composite" aria-pressed="true">Blend</button>
        <button type="button" data-sort="score12_1" aria-pressed="false">12-1</button>
        <button type="button" data-sort="score6_1" aria-pressed="false">6-1</button>
      </div>
    </div>

    <div class="row2">
      <input class="search" id="search" type="search" placeholder="search" aria-label="Search by ticker or company" />
      <button type="button" class="dir" id="dir" aria-label="Toggle sort direction">↓</button>
    </div>
  </header>

  <section class="summary" aria-live="polite">
    <div class="stats">
      <div class="stat">
        <span class="k eyebrow" id="stat-median-label">Med</span>
        <span class="v" id="stat-median"></span>
      </div>
      <div class="stat">
        <span class="k eyebrow">Best</span>
        <span class="v" id="stat-best"></span>
      </div>
      <div class="stat">
        <span class="k eyebrow">Pos</span>
        <span class="v" id="stat-pos"></span>
      </div>
      <div class="stat">
        <span class="k eyebrow">N</span>
        <span class="v" id="count"></span>
      </div>
    </div>

    <div class="hist" id="hist" role="img" aria-label="Distribution of scores"></div>
    <div class="hist-axis">
      <span id="hist-lo"></span><span>0</span><span id="hist-hi"></span>
    </div>
  </section>

  <main class="list" id="list"></main>

  <p class="colophon" id="colophon"></p>
</div>

<footer class="wl" aria-label="Watchlist">
  <div class="wl-inner">
    <div class="wl-stats" id="wl-stats"></div>
    <button type="button" id="wl-view" aria-pressed="false">WL</button>
    <button type="button" id="wl-clear">Clear</button>
  </div>
</footer>

<script>
  const DATA = __DATA__;

  const stocks = DATA.stocks;

  // One fixed cap across every view and horizon, so bar lengths stay
  // comparable when the filter changes. Set just past the 99.5th percentile:
  // a couple of extremes peg the track instead of flattening everyone else.
  const BAR_CAP = (() => {
    const mags = [];
    for (const s of stocks) {
      mags.push(Math.abs(s.composite), Math.abs(s.score12_1), Math.abs(s.score6_1));
    }
    mags.sort((a, b) => a - b);
    return Math.max(2.5, Math.ceil(mags[Math.floor(0.995 * (mags.length - 1))] * 2) / 2);
  })();

  const fmtScore = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
  const sign = (v) => (v >= 0 ? "pos" : "neg");

  // 11 sectors, abbreviated, each with its own hue. The abbreviation carries
  // the identity; the hue is a scanning aid, and none of them reuse the
  // green/red reserved for sign.
  const SECTORS = {
    "Technology": ["TECH", "#4da3ff"],
    "Communication Services": ["COMM", "#9d7bff"],
    "Healthcare": ["HLTH", "#2dd4bf"],
    "Financial Services": ["FIN", "#f2c14e"],
    "Energy": ["ENRG", "#ff9f43"],
    "Consumer Cyclical": ["CYCL", "#ff6ea1"],
    "Consumer Defensive": ["DFNS", "#c9a97c"],
    "Industrials": ["INDL", "#93a7bd"],
    "Basic Materials": ["MATL", "#b3c46e"],
    "Real Estate": ["RE", "#e07be0"],
    "Utilities": ["UTIL", "#7fd0d9"],
  };

  const state = { group: "__all", sort: "composite", desc: true, query: "", view: "all" };

  /* ---------- watchlist: tap rows to add/remove; equal weight ---------- */
  const WL_KEY = "momentum-desk-watchlist";
  const watchlist = new Set();
  try {
    for (const t of JSON.parse(localStorage.getItem(WL_KEY) ?? "[]")) watchlist.add(t);
  } catch {}

  function saveWatchlist() {
    try { localStorage.setItem(WL_KEY, JSON.stringify([...watchlist])); } catch {}
  }

  function toggle(symbol) {
    if (watchlist.has(symbol)) watchlist.delete(symbol);
    else watchlist.add(symbol);
    saveWatchlist();
    if (state.view === "wl") render();
    else renderWatchlistBar();
  }

  function renderWatchlistBar() {
    const host = document.getElementById("wl-stats");
    host.textContent = "";
    const stat = (k, v, s) => {
      const span = document.createElement("span");
      const key = document.createElement("span");
      key.className = "k";
      key.textContent = k;
      const val = document.createElement("span");
      val.className = "v num";
      if (s) val.dataset.sign = s;
      val.textContent = v;
      span.append(key, val);
      host.append(span);
    };

    const n = watchlist.size;
    stat("WL", n);
    if (n) {
      // Equal weight is the default sizing: 1/n per name.
      stat("EW", (100 / n).toFixed(n >= 20 ? 2 : 1) + "%");
      const members = stocks.filter((s) => watchlist.has(s.symbol));
      const avg = members.reduce((t, s) => t + s.composite, 0) / members.length;
      stat("Avg", fmtScore(avg), sign(avg));
    }

    document.getElementById("wl-clear").disabled = !n;
    for (const b of document.querySelectorAll(".row")) {
      b.setAttribute("aria-pressed", String(watchlist.has(b.dataset.symbol)));
    }
  }

  document.getElementById("wl-view").addEventListener("click", (e) => {
    state.view = state.view === "wl" ? "all" : "wl";
    e.currentTarget.setAttribute("aria-pressed", String(state.view === "wl"));
    render();
  });

  document.getElementById("wl-clear").addEventListener("click", () => {
    watchlist.clear();
    saveWatchlist();
    render();
  });

  /* ---------- group dropdown ---------- */
  const groupSel = document.getElementById("group");
  {
    const all = document.createElement("option");
    all.value = "__all";
    all.textContent = `All · ${stocks.length}`;
    groupSel.append(all);
    for (const g of DATA.groups) {
      const o = document.createElement("option");
      o.value = g.name;
      o.textContent = `${g.short ?? g.name} · ${g.count}`;
      groupSel.append(o);
    }
  }
  groupSel.addEventListener("change", () => {
    state.group = groupSel.value;
    render();
  });

  /* ---------- sort / direction / search ---------- */
  for (const b of document.querySelectorAll("[data-sort]")) {
    b.addEventListener("click", () => {
      state.sort = b.dataset.sort;
      for (const o of document.querySelectorAll("[data-sort]")) o.setAttribute("aria-pressed", String(o === b));
      render();
    });
  }

  const dirBtn = document.getElementById("dir");
  dirBtn.addEventListener("click", () => {
    state.desc = !state.desc;
    dirBtn.textContent = state.desc ? "↓" : "↑";
    render();
  });

  let searchTimer;
  document.getElementById("search").addEventListener("input", (e) => {
    clearTimeout(searchTimer);
    const v = e.target.value.trim().toLowerCase();
    searchTimer = setTimeout(() => { state.query = v; render(); }, 120);
  });

  /* ---------- rendering ---------- */
  function selected() {
    let out = stocks;
    if (state.view === "wl") out = out.filter((s) => watchlist.has(s.symbol));
    if (state.group !== "__all") out = out.filter((s) => s.group === state.group);
    if (state.query) {
      const q = state.query;
      out = out.filter((s) =>
        s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
    }
    const key = state.sort;
    return out.slice().sort((a, b) => (state.desc ? b[key] - a[key] : a[key] - b[key]));
  }

  function rowFor(s, i) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.dataset.symbol = s.symbol;
    b.setAttribute("aria-pressed", String(watchlist.has(s.symbol)));

    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = i + 1;

    const tkr = document.createElement("span");
    tkr.className = "tkr";
    tkr.textContent = s.symbol;

    const meta = document.createElement("span");
    meta.className = "meta";
    const [abbr, hue] = SECTORS[s.sector] ?? ["—", null];
    const sec = document.createElement("span");
    sec.className = "sec";
    sec.textContent = abbr;
    if (hue) sec.style.setProperty("--sec", hue);
    const nm = document.createElement("b");
    nm.textContent = s.name;
    meta.append(sec, nm);

    const val = document.createElement("span");
    val.className = "val";
    val.dataset.sign = sign(s[state.sort]);
    val.textContent = fmtScore(s[state.sort]);

    const bar = document.createElement("span");
    bar.className = "bar";
    const fill = document.createElement("u");
    fill.dataset.sign = sign(s[state.sort]);
    fill.style.width = Math.min(Math.abs(s[state.sort]) / BAR_CAP, 1) * 50 + "%";
    bar.append(fill);

    b.append(rank, tkr, val, meta, bar);
    b.addEventListener("click", () => toggle(s.symbol));
    return b;
  }

  function histogram(values) {
    const host = document.getElementById("hist");
    host.textContent = "";
    const BINS = 26, HI = BAR_CAP, LO = -BAR_CAP;
    const counts = new Array(BINS).fill(0);
    for (const v of values) {
      const idx = Math.min(BINS - 1, Math.max(0, Math.floor(((v - LO) / (HI - LO)) * BINS)));
      counts[idx]++;
    }
    const max = Math.max(1, ...counts);
    counts.forEach((c, i) => {
      const mid = LO + ((i + 0.5) / BINS) * (HI - LO);
      const bar = document.createElement("i");
      bar.style.height = Math.max(c ? 2 : 0, (c / max) * 100) + "%";
      if (c) bar.dataset.sign = sign(mid);
      host.append(bar);
    });
  }

  function median(xs) {
    if (!xs.length) return 0;
    const a = xs.slice().sort((x, y) => x - y);
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function render() {
    const rows = selected();
    const key = state.sort;
    const values = rows.map((s) => s[key]);

    const metricLabel = { composite: "blend", score12_1: "12-1", score6_1: "6-1" }[key];
    document.getElementById("stat-median-label").textContent = "Med " + metricLabel;
    document.getElementById("stat-median").textContent = rows.length ? fmtScore(median(values)) : "—";
    const best = rows.length ? rows.reduce((m, s) => (s[key] > m[key] ? s : m)) : null;
    document.getElementById("stat-best").textContent = best ? best.symbol : "—";
    document.getElementById("stat-pos").textContent = rows.length
      ? Math.round((values.filter((v) => v > 0).length / values.length) * 100) + "%"
      : "—";
    document.getElementById("count").textContent = rows.length;

    histogram(values);

    const list = document.getElementById("list");
    list.textContent = "";
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = state.view === "wl"
        ? "Watchlist is empty — tap rows to add."
        : "Nothing matches.";
      list.append(p);
    } else {
      const frag = document.createDocumentFragment();
      rows.forEach((s, i) => frag.append(rowFor(s, i)));
      list.append(frag);
    }

    renderWatchlistBar();
  }

  document.getElementById("hist-lo").textContent = "−" + BAR_CAP.toFixed(1);
  document.getElementById("hist-hi").textContent = "+" + BAR_CAP.toFixed(1);
  document.getElementById("asof").textContent = "close " + DATA.asOf;
  document.getElementById("colophon").textContent =
    "Score = ann. log return / ann. vol, same window; 12-1 = 252→21d back, 6-1 = 126→21d back; " +
    "blend = avg. Top ~25/group by cap, $15M+ median $ vol. " +
    DATA.stocks.length + " names · FMP adj. closes · not investment advice.";

  render();
</script>
