<title>Ranks — volatility-adjusted momentum</title>

<style>
  /* One typeface, two weights, hairlines, and colour on exactly one thing:
     the score. Neutrals carry a slight cool bias so the greys read as chosen
     rather than default. Both themes are defined token-level, covering all
     three viewer states (explicit light, explicit dark, unstamped system). */
  :root {
    --bg: #ffffff;
    --raise: #f7f8fa;
    --ink: #16181d;
    --ink-2: #4a4f59;
    --muted: #8a8f9a;
    --rule: #e9ebef;
    --rule-2: #d8dbe1;
    --pos: #12784a;
    --neg: #b03a2e;
    --sel: #f2f4f7;
    --flag: #9a5b12;
    --flag-bg: #f6efe4;
    --warn: #e0342f;
    --warn-glow: 224, 52, 47;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0d10;
      --raise: #131519;
      --ink: #eceef2;
      --ink-2: #b0b5be;
      --muted: #767c87;
      --rule: #1c1e24;
      --rule-2: #2a2d35;
      --pos: #46cf85;
      --neg: #ef6f60;
      --sel: #16181d;
      --flag: #e0a95c;
      --flag-bg: #221c12;
      --warn: #ff5a52;
      --warn-glow: 255, 90, 82;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c0d10;
    --raise: #131519;
    --ink: #eceef2;
    --ink-2: #b0b5be;
    --muted: #767c87;
    --rule: #1c1e24;
    --rule-2: #2a2d35;
    --pos: #46cf85;
    --neg: #ef6f60;
    --sel: #16181d;
    --flag: #e0a95c;
    --flag-bg: #221c12;
    --warn: #ff5a52;
    --warn-glow: 255, 90, 82;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .shell {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 0 calc(52px + env(safe-area-inset-bottom));
  }

  .num { font-variant-numeric: tabular-nums; }

  :where(button, input, select):focus-visible {
    outline: 2px solid var(--ink-2);
    outline-offset: -2px;
  }

  /* ---------- header ---------- */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
  }

  .title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 16px 12px;
  }

  .title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.03em;
  }

  /* One run of grey read as a single string. Split it: the count is a figure,
     the date is a caption beneath it. */
  .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    white-space: nowrap;
  }

  .meta b {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1.1;
  }

  .meta i {
    display: flex;
    align-items: center;
    gap: 5px;
    font-style: normal;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* The search row — named for what it does, now that Settings owns the
     filtering controls. It starts at 48px, not 16px, so its text lines up with
     the ticker column and the company names below rather than hanging off the
     left edge on its own. The right edge stays at 16px, matching where the
     numeric columns end. */
  .seek {
    display: flex;
    gap: 10px;
    padding: 0 16px 10px 48px;
  }

  .seek input,
  .seek select {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-bottom: 1px solid var(--rule-2);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    /* 16px exactly: iOS Safari zooms the whole viewport when a focused field is
       smaller than this, which shifts the layout out from under the reader. */
    font-size: 16px;
    padding: 4px 0;
    min-height: 32px;
  }

  /* The generic focus ring draws a box, which fights a design made of
     hairlines. These two fields state focus by owning their own rule instead. */
  .seek input:focus-visible,
  .seek select:focus-visible {
    outline: none;
    border-bottom-color: var(--ink);
    box-shadow: 0 1px 0 0 var(--ink);
  }

  .seek input { flex: 1; min-width: 0; }
  .seek input::placeholder { color: var(--muted); }
  .seek input::-webkit-search-cancel-button { display: none; }

  .pick { position: relative; flex: 0 0 auto; max-width: 48%; }
  .pick select { width: 100%; padding-right: 16px; text-overflow: ellipsis; }

  .pick::after {
    content: "";
    position: absolute;
    right: 2px;
    top: 13px;
    width: 5px;
    height: 5px;
    border-right: 1px solid var(--muted);
    border-bottom: 1px solid var(--muted);
    transform: rotate(45deg);
    pointer-events: none;
  }

  /* ---------- column headers; tapping one sorts by it ---------- */
  .head {
    display: grid;
    align-items: end;
    gap: 6px;
    padding: 0 16px 5px 0;
    border-bottom: 1px solid var(--rule-2);
  }

  .head button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 4px 0;
    font-family: inherit;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    text-align: right;
    white-space: nowrap;
  }

  .head .lbl {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 4px;
  }

  .head .lbl.l { text-align: left; }
  .head.grid .lbl:first-child { text-align: center; padding-left: 6px; }
  .head button[aria-pressed="true"] { color: var(--ink); }
  .head button[aria-pressed="true"]::after { content: attr(data-dir); margin-left: 3px; }

  /* ---------- rows ----------
     The rank column runs from the row's own left edge to 42px, and the cell is
     inset by the 6px gap, so the digits centre on 24px — exactly halfway to the
     ticker's left edge at 48px. */
  .grid { grid-template-columns: 42px minmax(0, 1fr) 46px 50px 42px; }
  /* ETF mode carries a look-through affordance, so every fund row reserves the
     column — otherwise the numbers would shift between funds that have holdings
     and funds that do not. */
  .grid-peek { grid-template-columns: 42px minmax(0, 1fr) 46px 50px 42px 18px; }
  .grid-hold { grid-template-columns: 42px minmax(0, 1fr) 46px 46px; }
  .grid-basket { grid-template-columns: minmax(0, 1fr) 46px 46px 42px; }
  /* "$1,000" needs more room than "10%"; two classes, so this beats .grid-basket */
  .grid-basket.cash { grid-template-columns: minmax(0, 1fr) 56px 44px 40px; }

  .list { display: flex; flex-direction: column; }

  /* A div rather than a button: the look-through affordance is itself a button,
     and a button inside a button is not valid HTML. Keyboard behaviour is
     restored by hand — see the keydown handler on the row. */
  .row {
    width: 100%;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: grid;
    align-items: center;
    gap: 6px;
    padding: 9px 16px 9px 0;
    min-height: 46px;
    box-sizing: border-box;
  }

  /* Holdings rows are a readout, not a control. */
  .row.static { cursor: default; }

  /* The look-through: a chevron drawn in rules, sized as a real tap target
     while occupying 18px of column. */
  .peek {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 12px 4px 12px 8px;
    margin: -12px -4px -12px -8px;
    cursor: pointer;
    line-height: 0;
  }

  .peek::after {
    content: "";
    display: block;
    width: 6px;
    height: 6px;
    border-top: 1.2px solid var(--muted);
    border-right: 1.2px solid var(--muted);
    transform: rotate(45deg);
  }

  .peek:hover::after { border-color: var(--ink); }

  /* two classes, so this beats .row's shorthand rather than racing it */
  .row.grid-basket { padding-left: 16px; }

  .row[aria-pressed="true"] { background: var(--sel); }

  .rank {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    text-align: center;
    padding-left: 6px;
  }

  .row[aria-pressed="true"] .rank { color: var(--ink-2); font-weight: 600; }

  .id { min-width: 0; }

  .id b {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  /* Name line: the company name gives way to the flags rather than pushing
     them into the numbers. */
  .sub {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    margin-top: 1px;
  }

  .sub i {
    font-style: normal;
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  /* Sector mark: identity, so it stays in the muted ink of the line it sits on. */
  .sub svg {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    opacity: .85;
  }

  /* Already represented: a dot, not a label. Small enough to cost nothing, lit
     enough to catch the eye on either ground. */
  .dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 2px rgba(var(--warn-glow), .16), 0 0 7px 1px rgba(var(--warn-glow), .55);
  }

  .n {
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
  }

  .n.score { font-weight: 600; color: var(--ink); }
  .n.score[data-sign="pos"] { color: var(--pos); }
  .n.score[data-sign="neg"] { color: var(--neg); }

  .more {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    padding: 14px;
    cursor: pointer;
  }

  .empty {
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  /* ---------- filters panel ---------- */
  .fgroup { padding: 4px 16px 0; }

  .fgroup h2 {
    margin: 18px 0 8px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .choice { display: flex; gap: 14px; align-items: center; }

  .choice button {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 2px 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .choice button[aria-pressed="true"] {
    color: var(--ink);
    box-shadow: inset 0 -1.5px 0 var(--ink);
  }

  /* an active filter has to be visible from the list, not only from its tab */
  .meta em {
    font-style: normal;
    font-weight: 600;
    font-size: 9.5px;
    color: var(--flag);
    background: var(--flag-bg);
    border-radius: 3px;
    padding: 1.5px 4px;
    margin-right: 6px;
  }

  /* ---------- basket summary ---------- */
  .sum { padding: 4px 16px 0; }

  .sum-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }

  .sum-row:last-child { border-bottom: 0; }
  .sum-row span:first-child { color: var(--muted); }
  .sum-row span:last-child { font-variant-numeric: tabular-nums; }

  .sec-head {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 16px 4px;
    border-bottom: 1px solid var(--rule-2);
  }

  /* ---------- footer tabs ---------- */
  .tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: flex;
    background: var(--bg);
    border-top: 1px solid var(--rule-2);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .tabs button {
    flex: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    min-height: 50px;
    cursor: pointer;
  }

  .tabs button[aria-pressed="true"] { color: var(--ink); }

  /* .filters and .head are flex/grid, which outranks the hidden attribute */
  [hidden] { display: none !important; }

  @media (min-width: 600px) {
    .shell { border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); min-height: 100vh; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="title">
      <h1 id="heading">Ranks</h1>
      <span class="meta" id="meta" hidden><b id="count-n"></b><i id="asof"></i></span>
    </div>

    <div class="seek" id="seek">
      <input id="q" type="search" placeholder="search" aria-label="Search ticker or company" />
      <div class="pick">
        <select id="sector" aria-label="Sector"></select>
      </div>
    </div>

    <div class="head grid" id="head">
      <span class="lbl">#</span>
      <span class="lbl l">Ticker</span>
      <button type="button" data-sort="score" data-dir="↓" aria-pressed="true" id="h-score">Blend</button>
      <button type="button" data-sort="ret" data-dir="↓" aria-pressed="false">Ret</button>
      <button type="button" data-sort="vol" data-dir="↑" aria-pressed="false">Vol</button>
    </div>
  </header>

  <div class="fgroup" id="settings-panel" hidden>
    <h2>Universe</h2>
    <div class="choice" role="group" aria-label="Universe">
      <button type="button" data-universe="stocks" aria-pressed="true">Stocks</button>
      <button type="button" data-universe="etfs" aria-pressed="false">ETFs</button>
    </div>

    <h2>Weights</h2>
    <div class="choice" role="group" aria-label="Weighting">
      <button type="button" data-weight="eq" aria-pressed="false">Equal</button>
      <button type="button" data-weight="iv" aria-pressed="true">Inv vol</button>
      <button type="button" data-weight="hrp" aria-pressed="false" title="Hierarchical risk parity: 252-day returns, shrunk covariance, clustered, capped at 10%">HRP</button>
    </div>

    <h2>Display</h2>
    <div class="choice" role="group" aria-label="Weight display">
      <button type="button" data-display="pct" aria-pressed="true">Percent</button>
      <button type="button" data-display="cash" aria-pressed="false" title="Cash needed per holding in a $10,000 portfolio">Cash</button>
    </div>

    <h2>Metric</h2>
    <div class="choice" role="group" aria-label="Metric">
      <button type="button" data-metric="0" aria-pressed="true">Blend</button>
      <button type="button" data-metric="1" aria-pressed="false">12-1</button>
      <button type="button" data-metric="2" aria-pressed="false">6-1</button>
    </div>

    <h2 id="cap-head">Market cap</h2>
    <div class="choice" id="cap-choice" role="group" aria-label="Market cap cutoff">
      <button type="button" data-cap="0" aria-pressed="true">All</button>
      <button type="button" data-cap="500" aria-pressed="false">Top 500</button>
    </div>
  </div>

  <div class="sum" id="sum" hidden></div>
  <main class="list" id="list"></main>
</div>

<nav class="tabs">
  <button type="button" id="tab-ranks" aria-pressed="true">Ranks</button>
  <button type="button" id="tab-basket" aria-pressed="false">Basket</button>
  <button type="button" id="tab-settings" aria-pressed="false">Settings</button>
</nav>

<script>
  const DATA = __DATA__;

  const UNIVERSES = DATA.universes;

  /* One 12px line-drawing per sector, keyed by name so a rebuild reordering the
     sector list cannot shuffle them. Each picks the most literal object in that
     sector's world rather than an abstract mark, so it reads without a legend. */
  const GLYPH = {
    "Technology":             "M3.1 3.1h5.8v5.8H3.1z M6 1.1v2 M6 8.9v2 M1.1 6h2 M8.9 6h2",
    "Communication Services": "M3.4 8.6a3.6 3.6 0 010-5.2 M8.6 3.4a3.6 3.6 0 010 5.2 M6 5.2a.8.8 0 100 1.6.8.8 0 000-1.6z",
    "Healthcare":             "M6 2.2v7.6 M2.2 6h7.6",
    "Financial Services":     "M1.8 4.9L6 2.3l4.2 2.6 M1.8 9.9h8.4 M3.5 5.6v3.5 M6 5.6v3.5 M8.5 5.6v3.5",
    "Energy":                 "M6 1.7c2.1 2.6 3.1 4.1 3.1 5.5a3.1 3.1 0 11-6.2 0c0-1.4 1-2.9 3.1-5.5z",
    "Consumer Cyclical":      "M2.7 4.3h6.6l-.6 6.1H3.3z M4.5 4.3V3.3a1.5 1.5 0 013 0v1",
    "Consumer Defensive":     "M6 1.7l3.7 1.4v3.1c0 2.3-1.6 3.6-3.7 4.4-2.1-.8-3.7-2.1-3.7-4.4V3.1z",
    "Industrials":            "M1.8 10.2V6.1l2.7 2V6.1l2.7 2V2.6h2.9v7.6z",
    "Basic Materials":        "M6 1.7l4.1 2.3v4L6 10.3 1.9 8V4z M1.9 4L6 6.3 10.1 4 M6 6.3v4",
    "Real Estate":            "M1.5 6L6 2.4l4.5 3.6 M3 5.6v4.6h6V5.6",
    "Utilities":              "M6.9 1.6L3.2 6.9h2.5l-.6 3.5 4-5.4H6.4z",
  };

  // The ETF list groups by theme, not sector. Ten themes map cleanly onto a
  // sector mark; six needed drawing.
  Object.assign(GLYPH, {
    "Broad sectors":                                "M2.2 2.2h3.2v3.2H2.2z M6.6 2.2h3.2v3.2H6.6z M2.2 6.6h3.2v3.2H2.2z M6.6 6.6h3.2v3.2H6.6z",
    "Technology and digital economy":               GLYPH["Technology"],
    "Health care":                                  GLYPH["Healthcare"],
    "Financials":                                   GLYPH["Financial Services"],
    "Energy and power":                             GLYPH["Energy"],
    "Metals, mining and materials":                 GLYPH["Basic Materials"],
    "Industrials, manufacturing and infrastructure": GLYPH["Industrials"],
    "Construction, housing and real estate":        GLYPH["Real Estate"],
    "Consumer, retail and leisure":                 GLYPH["Consumer Cyclical"],
    "Communication, media and entertainment":       GLYPH["Communication Services"],
    "Clean energy and electrification":             GLYPH["Utilities"],
    // sprout
    "Agriculture and food":                         "M6 10.4V5.2 M6 5.6C6 3.7 7.4 2.2 9.5 2.1c.1 2-1.3 3.5-3.5 3.5z M6 7.1C6 5.6 4.8 4.4 3 4.3c-.1 1.6 1.1 2.8 3 2.8z",
    // wave
    "Water and environmental infrastructure":       "M1.5 4.4c1.1-1 2.2-1 3.3 0s2.2 1 3.3 0 2.2-1 2.4-.6 M1.5 7c1.1-1 2.2-1 3.3 0s2.2 1 3.3 0 2.2-1 2.4-.6 M1.5 9.6c1.1-1 2.2-1 3.3 0s2.2 1 3.3 0 2.2-1 2.4-.6",
    // rocket
    "Defense, aerospace and space":                 "M6 1.4c1.7 1.6 2.5 3.4 2.5 5.3L6 8.6 3.5 6.7c0-1.9.8-3.7 2.5-5.3z M3.5 6.3L2 8.1l1.6.5 M8.5 6.3L10 8.1l-1.6.5 M5.2 9.2h1.6",
    // linked nodes
    "Automation, AI and advanced manufacturing":    "M6 1.6a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z M2.6 8a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z M9.4 8a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z M5.2 4.2L3.4 7.8 M6.8 4.2l1.8 3.6 M3.9 9.2h4.2",
    // mountains
    "Natural resources":                            "M1.3 9.6l3.1-5.2 2 3.3 M4.6 9.6l3-5.6 3.1 5.6z",
  });

  function glyphFor(sector) {
    const d = GLYPH[sector];
    if (!d) return null;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 12 12");
    svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.append(path);
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
    t.textContent = sector;
    svg.append(t);
    return svg;
  }
  const T = 252; // daily returns per vector — the risk basis for both ρ and HRP

  /* ---------- allocator, inlined verbatim from src/hrp.js ----------
     Kept in its own file so `npm run test:hrp` can check the maths against
     cases with known answers; the renderer drops it in here. */
__HRP__

  const PORTFOLIO = 10000; // the hypothetical book that cash display sizes against
  /* One mark, one question: is this name's behaviour already available from
     what I hold? `spannedR2` answers it — the share of the candidate's movement
     explained by regressing it on every holding at once. Half is the line.

     Measured against the real universe, the flag rate rises with the basket
     rather than exploding: 0.6% of names against a single holding, 0.9%
     against eight, 5.7% against fourteen. */
  const OVERLAP_FLAG = 0.50;
  const PAGE = 120;

  // 0 = blend, 1 = 12-1, 2 = 6-1; the switch moves score, ret and vol together.
  const METRICS = ["Blend", "12-1", "6-1"];
  const sc = (s) => s.sc[state.metric];
  const rt = (s) => s.rt[state.metric];
  const vl = (s) => s.vl[state.metric];

  /* ---------- return vectors ----------
     Every item ships 252 standardised daily log returns as int8. Re-centre and
     re-normalise on decode and the dot product of two vectors is exactly their
     correlation; multiply one by its `sd` and you have the return series back,
     which is what the HRP covariance is built from. Both universes use the
     identical encoding, so one decoder serves both. */
  function decodeVectors(items) {
    const N = items.length;
    const VEC = new Float32Array(N * T);
    const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    const idx = new Uint8Array(128);
    for (let i = 0; i < 64; i++) idx[B64.charCodeAt(i)] = i;

    for (let s = 0; s < N; s++) {
      const str = items[s].c;
      const off = s * T;
      let out = 0;
      for (let i = 0; i + 3 < str.length && out < T; i += 4) {
        const n = (idx[str.charCodeAt(i)] << 18) | (idx[str.charCodeAt(i + 1)] << 12) |
                  (idx[str.charCodeAt(i + 2)] << 6) | idx[str.charCodeAt(i + 3)];
        for (const byte of [(n >> 16) & 255, (n >> 8) & 255, n & 255]) {
          if (out < T) VEC[off + out++] = byte > 127 ? byte - 256 : byte;
        }
      }
      let mean = 0;
      for (let t = 0; t < T; t++) mean += VEC[off + t];
      mean /= T;
      let ss = 0;
      for (let t = 0; t < T; t++) { VEC[off + t] -= mean; ss += VEC[off + t] * VEC[off + t]; }
      const norm = Math.sqrt(ss) || 1;
      for (let t = 0; t < T; t++) VEC[off + t] /= norm;
    }
    return VEC;
  }

  function rho(a, b) {
    const oa = a * T, ob = b * T;
    let d = 0;
    for (let t = 0; t < T; t++) d += U.vec[oa + t] * U.vec[ob + t];
    return d;
  }

  /* ---------- a universe is everything derived from one item list ----------
     Switching between stocks and funds swaps this whole object, so nothing
     downstream has to know which one it is holding. */
  function buildUniverse(key) {
    const src = UNIVERSES[key];
    const items = src.items.map((it, i) => ({ ...it, i, group: src.groups[it.k] }));
    const N = items.length;

    // "Top 500 largest" is a rank, not a dollar line: an absolute threshold
    // drifts as the market moves, a rank does not. Funds have no capitalisation,
    // so they get no ranking and the setting hides itself.
    let capRank = null;
    if (src.hasCap) {
      capRank = new Int32Array(N);
      items.map((it) => it.i).sort((a, b) => items[b].m - items[a].m)
        .forEach((idx, i) => { capRank[idx] = i + 1; });
    }

    const picked = new Set();
    try {
      for (const t of JSON.parse(localStorage.getItem(`ranks-basket-${key}`) ?? "[]")) picked.add(t);
    } catch {}

    return {
      key, items, N, picked, capRank,
      label: src.label,
      groupLabel: src.groupLabel,
      groups: src.groups,
      hasCap: src.hasCap,
      hasHoldings: src.items.some((it) => it.h),
      asOf: src.asOf ?? DATA.asOf,
      vec: decodeVectors(src.items),
      // Share of each item already spanned by the basket, kept as an array so
      // rows can be flagged without recomputing per render.
      overlap: new Float32Array(N),
    };
  }
  /* ---------- state ---------- */
  const state = {
    view: "ranks", sort: "score", desc: true, q: "", sector: "",
    metric: 0, cap: 0, universe: "stocks", weight: "iv", display: "pct",
    peek: null,
  };

  const WEIGHTS = ["eq", "iv", "hrp"];
  const FILTER_KEY = "ranks-filters";
  try {
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY) ?? "{}");
    if (saved.cap === 500) state.cap = 500;
    if (saved.universe && UNIVERSES[saved.universe]) state.universe = saved.universe;
    if (WEIGHTS.includes(saved.weight)) state.weight = saved.weight;
    if (saved.display === "cash") state.display = "cash";
  } catch {}

  function saveFilters() {
    try {
      localStorage.setItem(FILTER_KEY, JSON.stringify({
        cap: state.cap, universe: state.universe, weight: state.weight, display: state.display,
      }));
    } catch {}
  }

  let U = buildUniverse(state.universe);

  function setUniverse(key) {
    if (key === state.universe) return;
    state.universe = key;
    state.peek = null;
    U = buildUniverse(key);
    // A sector name is not a theme name; carrying the old selection across would
    // silently match nothing.
    state.sector = "";
    fillSectors();
    saveFilters();
    recomputeOverlap();
    shown = PAGE;
    render();
  }

  const held = () => U.items.filter((it) => U.picked.has(it.symbol));

  /**
   * How much of every candidate is already in the basket. The holdings'
   * correlation matrix is factorised once, so each candidate costs one pass to
   * gather its correlations and O(k²) to solve.
   */
  function recomputeOverlap() {
    U.overlap.fill(0);
    const h = held();
    if (!h.length) return;

    const L = cholesky(shrunkCorrelation(h.map((s) => ({
      u: U.vec.subarray(s.i * T, s.i * T + T),
      sd: s.sd > 0 ? s.sd : Math.max(s.vl[0], 1e-6),
    }))));

    const at = h.map((s) => s.i);
    const c = new Float64Array(at.length);
    for (let i = 0; i < U.N; i++) {
      if (U.picked.has(U.items[i].symbol)) continue; // already in; nothing to warn about
      for (let j = 0; j < at.length; j++) c[j] = rho(i, at[j]);
      U.overlap[i] = spannedR2(L, c, T);
    }
  }

  const fmtScore = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
  const fmtPct = (v) => (v * 100).toFixed(0) + "%";
  const sign = (v) => (v >= 0 ? "pos" : "neg");

  function save() {
    try { localStorage.setItem(`ranks-basket-${U.key}`, JSON.stringify([...U.picked])); } catch {}
  }

  function toggle(symbol) {
    if (U.picked.has(symbol)) U.picked.delete(symbol);
    else U.picked.add(symbol);
    save();
    recomputeOverlap();
    render();
  }

  /* ---------- weights ----------
     Three schemes over the same holdings. Equal and inverse-vol size off the
     volatility the Vol column already shows, so both stay checkable against the
     numbers on screen. HRP cannot be — it needs the whole covariance — so it
     runs off the 252-day return vectors instead, which is also the window its
     shrinkage and clustering are defined on. */
  let hrpCache = { key: "", w: null, capBound: false, delta: 0 };

  function hrpFor(rows) {
    const key = U.key + "|" + rows.map((s) => s.symbol).join(",");
    if (hrpCache.key !== key) {
      const input = rows.map((s) => ({
        u: U.vec.subarray(s.i * T, s.i * T + T),
        sd: s.sd > 0 ? s.sd : Math.max(s.vl[0], 1e-6),
      }));
      const out = hrpWeights(input);
      hrpCache = { key, w: out.w, capBound: out.capBound, delta: out.delta };
    }
    return hrpCache;
  }

  function weights(rows) {
    const n = rows.length;
    if (!n) return [];
    if (state.weight === "eq") return rows.map((s) => ({ s, w: 1 / n }));
    if (state.weight === "hrp") {
      const out = hrpFor(rows);
      return rows.map((s, i) => ({ s, w: out.w[i] }));
    }
    // Sizing uses the blended volatility — the displayed metric changes what
    // you are reading, not how the basket is built.
    const inv = rows.map((s) => 1 / Math.max(s.vl[0], 1e-6));
    const total = inv.reduce((a, b) => a + b, 0);
    return rows.map((s, i) => ({ s, w: inv[i] / total }));
  }

  /* ---------- controls ---------- */
  const sectorSel = document.getElementById("sector");

  function fillSectors() {
    sectorSel.textContent = "";
    const all = document.createElement("option");
    all.value = "";
    all.textContent = U.groupLabel;
    sectorSel.append(all);
    for (const name of U.groups) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      sectorSel.append(o);
    }
    sectorSel.value = state.sector;
  }
  fillSectors();
  sectorSel.addEventListener("change", () => { state.sector = sectorSel.value; shown = PAGE; render(); });

  let timer;
  document.getElementById("q").addEventListener("input", (e) => {
    clearTimeout(timer);
    const v = e.target.value.trim().toLowerCase();
    timer = setTimeout(() => { state.q = v; render(); }, 120);
  });

  for (const b of document.querySelectorAll("[data-metric]")) {
    b.addEventListener("click", () => { state.metric = +b.dataset.metric; render(); });
  }

  for (const b of document.querySelectorAll("[data-sort]")) {
    b.addEventListener("click", () => {
      // Same column taps flip direction; a new column opens on its natural one
      // — high score and return first, low volatility first.
      if (state.sort === b.dataset.sort) state.desc = !state.desc;
      else { state.sort = b.dataset.sort; state.desc = b.dataset.sort !== "vol"; }
      render();
    });
  }

  for (const b of document.querySelectorAll("[data-universe]")) {
    b.addEventListener("click", () => setUniverse(b.dataset.universe));
  }

  for (const b of document.querySelectorAll("[data-cap]")) {
    b.addEventListener("click", () => { state.cap = +b.dataset.cap; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-weight]")) {
    b.addEventListener("click", () => { state.weight = b.dataset.weight; saveFilters(); render(); });
  }

  for (const b of document.querySelectorAll("[data-display]")) {
    b.addEventListener("click", () => { state.display = b.dataset.display; saveFilters(); render(); });
  }

  document.getElementById("tab-settings").addEventListener("click", () => { state.view = "settings"; render(); });
  document.getElementById("tab-ranks").addEventListener("click", () => {
    state.view = "ranks";
    state.peek = null;
    render();
  });
  document.getElementById("tab-basket").addEventListener("click", () => { state.view = "basket"; render(); });

  /* ---------- rendering ---------- */
  let shown = PAGE;

  function selected() {
    let out = U.items;
    // Filters only decide who is listed; scores are computed against the whole
    // universe and never move. The rank is positional, so it renumbers.
    if (state.cap && U.capRank) out = out.filter((s) => U.capRank[s.i] <= state.cap);
    if (state.sector) out = out.filter((s) => s.group === state.sector);
    if (state.q) {
      out = out.filter((s) =>
        s.symbol.toLowerCase().includes(state.q) || s.name.toLowerCase().includes(state.q));
    }
    const f = { score: sc, ret: rt, vol: vl }[state.sort];
    return out.slice().sort((a, b) => (state.desc ? f(b) - f(a) : f(a) - f(b)));
  }

  function cell(v, cls, sgn) {
    const el = document.createElement("span");
    el.className = "n" + (cls ? " " + cls : "");
    if (sgn) el.dataset.sign = sgn;
    el.textContent = v;
    return el;
  }

  function rowFor(s, ordinal, weight) {
    const b = document.createElement("div");
    b.setAttribute("role", "button");
    b.tabIndex = 0;
    b.className = "row " + (state.view === "basket" ? basketGrid() : listGrid());
    b.setAttribute("aria-pressed", String(U.picked.has(s.symbol)));

    if (state.view !== "basket") {
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = ordinal;
      b.append(rank);
    }

    const id = document.createElement("span");
    id.className = "id";
    const tkr = document.createElement("b");
    tkr.textContent = s.symbol;

    const sub = document.createElement("span");
    sub.className = "sub";
    const mark = glyphFor(s.group);
    if (mark) sub.append(mark);
    // An empty name means it tidied down to the ticker; the line is dropped
    // rather than repeating what the row already says.
    if (s.name) {
      const nm = document.createElement("i");
      nm.textContent = s.name;
      sub.append(nm);
    }

    // Already represented: the one mark on a row, and it says only that.
    if (U.overlap[s.i] >= OVERLAP_FLAG) {
      const pct = Math.round(U.overlap[s.i] * 100);
      const n = U.picked.size;
      const label = `${pct}% of this name is already explained by the ${n} name${n === 1 ? "" : "s"} you hold`;
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.title = label;
      dot.setAttribute("role", "img");
      dot.setAttribute("aria-label", label);
      sub.append(dot);
    }
    id.append(tkr, sub);
    b.append(id);

    if (state.view === "basket") {
      b.append(cell(weight, "score"));
      b.append(cell(fmtScore(sc(s)), "", sign(sc(s))));
      b.append(cell(fmtPct(vl(s))));
    } else {
      b.append(cell(fmtScore(sc(s)), "score", sign(sc(s))));
      b.append(cell(fmtPct(rt(s))));
      b.append(cell(fmtPct(vl(s))));

      // The row selects; the chevron looks through. Funds without a holdings
      // list still get the empty cell so the columns stay put.
      if (U.hasHoldings) {
        if (s.h) {
          const peek = document.createElement("button");
          peek.type = "button";
          peek.className = "peek";
          peek.title = `${s.symbol} holdings`;
          peek.setAttribute("aria-label", `Show ${s.symbol} holdings`);
          peek.addEventListener("click", (e) => { e.stopPropagation(); openHoldings(s.symbol); });
          b.append(peek);
        } else {
          b.append(document.createElement("span"));
        }
      }
    }

    b.addEventListener("click", () => toggle(s.symbol));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      toggle(s.symbol);
    });
    return b;
  }

  function renderRanks() {
    const rows = selected();
    document.getElementById("meta").hidden = false;
    document.getElementById("count-n").textContent = rows.length.toLocaleString();
    const asof = document.getElementById("asof");
    asof.textContent = "";
    if (state.cap && U.hasCap) {
      const tag = document.createElement("em");
      tag.textContent = "TOP " + state.cap;
      asof.append(tag);
    }
    asof.append(U.asOf);

    const list = document.getElementById("list");
    list.textContent = "";
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing matches.";
      list.append(p);
      return;
    }

    const frag = document.createDocumentFragment();
    for (let i = 0; i < Math.min(shown, rows.length); i++) frag.append(rowFor(rows[i], i + 1));
    list.append(frag);

    if (rows.length > shown) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "more";
      more.textContent = `${rows.length - shown} more`;
      more.addEventListener("click", () => { shown += PAGE * 2; render(); });
      list.append(more);
    }
  }

  function renderBasket() {
    const rows = held();
    document.getElementById("meta").hidden = !rows.length;
    document.getElementById("count-n").textContent = rows.length;
    document.getElementById("asof").textContent = rows.length === 1 ? "name" : "names";

    const sum = document.getElementById("sum");
    const list = document.getElementById("list");
    sum.textContent = "";
    list.textContent = "";

    if (!rows.length) {
      sum.hidden = true;
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Tap a row in Ranks to add it.";
      list.append(p);
      return;
    }
    sum.hidden = false;

    const w = weights(rows);
    w.sort((a, b) => sc(b.s) - sc(a.s));

    // Whole percents or whole dollars, apportioned so the column sums to
    // exactly 100% or exactly $10,000 — a column of weights is a thing readers
    // add up, and rounding each row on its own does not land on the total.
    const cash = state.display === "cash";
    const parts = apportion(w.map((x) => x.w), cash ? PORTFOLIO : 100);
    const fmtWeight = (i) => (cash ? "$" + parts[i].toLocaleString("en-US") : parts[i] + "%");
    let top = 0;
    for (let i = 1; i < w.length; i++) if (w[i].w > w[top].w) top = i;

    const avgScore = rows.reduce((t, s) => t + sc(s), 0) / rows.length;
    const wVol = w.reduce((t, x) => t + x.w * x.s.vl[0], 0);
    const line = (k, v) => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const a = document.createElement("span");
      a.textContent = k;
      const b = document.createElement("span");
      b.textContent = v;
      row.append(a, b);
      sum.append(row);
    };
    line("Avg " + METRICS[state.metric].toLowerCase(), fmtScore(avgScore));
    line("Weighted vol", fmtPct(wVol));
    line("Largest weight", fmtWeight(top));

    const counts = new Map();
    for (const it of rows) counts.set(it.group, (counts.get(it.group) ?? 0) + 1);
    for (const [name, n] of [...counts].sort((a, b) => b[1] - a[1])) line(name, n);

    const head = document.createElement("div");
    head.className = "head " + basketGrid();
    head.style.paddingLeft = "0";
    head.style.paddingRight = "0";
    head.style.marginTop = "16px";
    // "$10K" names the unit and the base the cash figures are sized against, in
    // the four characters the column already has.
    for (const [text, cls] of [["Holdings", "lbl l"], [cash ? "$10K" : "Wt", "lbl"], ["Score", "lbl"], ["Vol", "lbl"]]) {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      el.style.textAlign = cls.endsWith("l") ? "left" : "right";
      head.append(el);
    }
    sum.append(head);

    const frag = document.createDocumentFragment();
    w.forEach((x, i) => frag.append(rowFor(x.s, 0, fmtWeight(i))));
    list.append(frag);
  }

  const basketGrid = () => "grid-basket" + (state.display === "cash" ? " cash" : "");
  const listGrid = () => (U.hasHoldings ? "grid-peek" : "grid");

  /* ---------- look-through ----------
     A fund's top holdings, resolved against the stock universe. Rank and score
     follow the metric switch, so what you read here is the same number the
     stock list would show. */
  const rankCache = new Map();

  function stockRanks() {
    if (rankCache.has(state.metric)) return rankCache.get(state.metric);
    const items = UNIVERSES.stocks.items;
    const order = items.map((_, i) => i)
      .sort((a, b) => items[b].sc[state.metric] - items[a].sc[state.metric]);
    const rank = new Int32Array(items.length);
    order.forEach((idx, i) => { rank[idx] = i + 1; });
    rankCache.set(state.metric, rank);
    return rank;
  }

  function openHoldings(symbol) {
    state.peek = symbol;
    state.view = "holdings";
    render();
  }

  function renderHoldings() {
    const fund = U.items.find((it) => it.symbol === state.peek);
    const sum = document.getElementById("sum");
    const list = document.getElementById("list");
    sum.textContent = "";
    list.textContent = "";

    if (!fund || !fund.h) { state.view = "ranks"; render(); return; }

    const stocks = UNIVERSES.stocks.items;
    const rank = stockRanks();
    const listed = fund.h.reduce((t, [, wt]) => t + wt, 0);

    document.getElementById("meta").hidden = false;
    document.getElementById("count-n").textContent = fund.h.length;
    document.getElementById("asof").textContent = "holdings";

    const line = (k, v, cls) => {
      const row = document.createElement("div");
      row.className = "sum-row";
      const a = document.createElement("span");
      a.textContent = k;
      const b = document.createElement("span");
      b.textContent = v;
      if (cls) b.className = cls;
      row.append(a, b);
      sum.append(row);
    };

    // The fund's own score against its holdings' — the gap is the whole point.
    // A fund of 70 names carries a fraction of its average constituent's
    // volatility, and the score is a return divided by exactly that.
    const matched = fund.h.filter(([, , i]) => i >= 0);
    const mw = matched.reduce((t, [, wt]) => t + wt, 0);
    line(fund.symbol + " blend", fmtScore(sc(fund)));
    if (mw > 0) {
      const wScore = matched.reduce((t, [, wt, i]) => t + wt * sc(stocks[i]), 0) / mw;
      const wVol = matched.reduce((t, [, wt, i]) => t + wt * vl(stocks[i]), 0) / mw;
      line("Holdings blend", fmtScore(wScore));
      line("Holdings vol", fmtPct(wVol) + " vs " + fmtPct(vl(fund)));
    }
    line("Listed weight", listed.toFixed(1) + "% of fund");

    const head = document.createElement("div");
    head.className = "head grid-hold";
    head.style.paddingLeft = "0";
    head.style.paddingRight = "0";
    head.style.marginTop = "16px";
    for (const [text, cls] of [["#", "lbl"], ["Holding", "lbl l"], ["Wt", "lbl"], [METRICS[state.metric], "lbl"]]) {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      el.style.textAlign = cls.endsWith("l") ? "left" : cls === "lbl" && text === "#" ? "center" : "right";
      head.append(el);
    }
    sum.append(head);

    const frag = document.createDocumentFragment();
    for (const [sym, wt, i, note] of fund.h) {
      const row = document.createElement("div");
      row.className = "row static grid-hold";

      const r = document.createElement("span");
      r.className = "rank";
      r.textContent = i >= 0 ? rank[i] : "—";
      row.append(r);

      const id = document.createElement("span");
      id.className = "id";
      const tkr = document.createElement("b");
      tkr.textContent = sym;
      const sub = document.createElement("span");
      sub.className = "sub";
      // A miss is a fact about the fund's book, so it is marked rather than
      // hidden — and it says only what is known. Some are under the $25M
      // liquidity floor; CRAK's are foreign lines that were never candidates.
      const label = i >= 0 ? stocks[i].name : note;
      if (label) {
        const nm = document.createElement("i");
        nm.textContent = label;
        sub.append(nm);
      }
      id.append(tkr, sub);
      row.append(id);

      row.append(cell(wt.toFixed(2) + "%"));
      row.append(i >= 0
        ? cell(fmtScore(sc(stocks[i])), "score", sign(sc(stocks[i])))
        : cell("—"));
      frag.append(row);
    }
    list.append(frag);
  }

  function renderSettings() {
    document.getElementById("meta").hidden = true;
    document.getElementById("list").textContent = "";
  }

  function render() {
    const view = state.view;
    const list = view === "ranks";
    const peek = view === "holdings";
    document.getElementById("heading").textContent =
      view === "basket" ? "Basket" : view === "settings" ? "Settings" : peek ? state.peek : "Ranks";
    document.getElementById("seek").hidden = !list;
    const head = document.getElementById("head");
    head.hidden = !list;
    head.className = "head " + listGrid();
    document.getElementById("sum").hidden = !(view === "basket" || peek);
    document.getElementById("settings-panel").hidden = view !== "settings";
    // The look-through is reached from Ranks and returns there, so the Ranks
    // tab stays lit rather than leaving no tab selected.
    document.getElementById("tab-ranks").setAttribute("aria-pressed", String(list || peek));
    document.getElementById("tab-basket").setAttribute("aria-pressed", String(view === "basket"));
    document.getElementById("tab-settings").setAttribute("aria-pressed", String(view === "settings"));

    for (const b of document.querySelectorAll("[data-universe]")) {
      b.setAttribute("aria-pressed", String(b.dataset.universe === state.universe));
    }
    for (const b of document.querySelectorAll("[data-cap]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.cap === state.cap));
    }
    for (const b of document.querySelectorAll("[data-weight]")) {
      b.setAttribute("aria-pressed", String(b.dataset.weight === state.weight));
    }
    for (const b of document.querySelectorAll("[data-display]")) {
      b.setAttribute("aria-pressed", String(b.dataset.display === state.display));
    }
    // A fund has assets, not a capitalisation — the cutoff has nothing to rank.
    document.getElementById("cap-head").hidden = !U.hasCap;
    document.getElementById("cap-choice").hidden = !U.hasCap;

    for (const b of document.querySelectorAll("[data-metric]")) {
      b.setAttribute("aria-pressed", String(+b.dataset.metric === state.metric));
    }
    document.getElementById("h-score").textContent = METRICS[state.metric];

    for (const b of document.querySelectorAll("[data-sort]")) {
      const on = b.dataset.sort === state.sort;
      b.setAttribute("aria-pressed", String(on));
      if (on) b.dataset.dir = state.desc ? "↓" : "↑";
    }

    document.getElementById("tab-basket").textContent =
      U.picked.size ? `Basket · ${U.picked.size}` : "Basket";

    if (view === "basket") renderBasket();
    else if (view === "settings") renderSettings();
    else if (peek) renderHoldings();
    else renderRanks();
  }

  recomputeOverlap();
  render();
</script>
